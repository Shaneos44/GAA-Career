<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Gaelic Hero — Junior B to All-Ireland</title>
<meta name="description" content="A skill-based Gaelic football career game. Win your division, survive the championship, and climb from Junior B club football to an All-Ireland and an All Star." />
<meta name="theme-color" content="#0E1116" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Gaelic Hero" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<style>
/* Gaelic Hero — mobile-first. Designed for a phone in one hand: bottom tab
   bar, thumb-reachable primary actions, no hover-dependent affordances. */


:root {
  /* Font stacks live in tokens so build.js can swap them for system faces
     in the single-file build, where a font CDN may be blocked. */
  --font-display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --font-body:    Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --bg:        #0E1116;
  --surface:   #161A21;
  --surface-2: #1E242D;
  --edge:      #2A313C;
  --edge-lit:  #3A4452;
  --text:      #EDF0F4;
  --text-dim:  #8A93A2;
  --signal:    #2E8B57;   /* pitch green */
  --signal-d:  #23724A;
  --signal-lt: #6FCF97;
  --signal-ink:#FFFFFF;
  --gold:      #F2C94C;
  --bad:       #FF6B6B;
  --r:  12px;
  --r-lg: 18px;
  --tabbar-h: 60px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); overscroll-behavior-y: none; }
body {
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
.dim { color: var(--text-dim); }
.small { font-size: 13px; }
.gold { color: var(--gold); }

button, input, select { font-family: inherit; touch-action: manipulation; }

/* Long-pressing a control must never raise a text-selection or callout menu.
   The high ball is a press-and-hold gesture, and WebKit will otherwise offer
   "Copy" over the button label mid-charge. -webkit-touch-callout is the part
   that actually suppresses the iOS callout; user-select alone does not.
   Body copy (match news, the guide, the rules) stays selectable. */
button, .gf-match-overlay, .gf-coach, .gf-pos, .gf-toggle, .gf-guide-item summary {
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.gf-app { min-height: 100dvh; }
.gf-wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 14px
           calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));
}

/* ---------- Panels & form ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--edge);
  border-radius: var(--r-lg); padding: 14px; margin-bottom: 12px;
}
label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
        text-transform: uppercase; color: var(--text-dim); margin-bottom: 7px; }
input, select {
  width: 100%; min-height: 50px; padding: 12px 14px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--edge); border-radius: var(--r);
  font-size: 16px; /* 16px avoids iOS zoom-on-focus */
}
input:focus, select:focus {
  outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px rgba(46,139,87,.25);
}
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 0 18px;
  border-radius: var(--r); border: 1px solid var(--edge-lit);
  background: var(--surface-2); color: var(--text);
  font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: transform .08s ease, background .15s ease;
  user-select: none;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn + .btn { margin-top: 10px; }
.btn-primary { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); font-weight: 700; }
.btn-primary:active:not(:disabled) { background: var(--signal-d); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-lg { min-height: 58px; font-size: 17px; }

/* ---------- Header ---------- */
.gf-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.gf-id { min-width: 0; }
.gf-title { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -.02em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gf-sub { color: var(--text-dim); font-size: 12.5px; margin-top: 1px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gf-ovr {
  flex-shrink: 0; width: 54px; height: 54px; border-radius: 14px;
  display: grid; place-content: center; text-align: center;
  background: linear-gradient(160deg, var(--signal), var(--signal-d));
  border: 1px solid rgba(255,255,255,.14);
}
.gf-ovr span { font-family: var(--font-mono); font-size: 20px; font-weight: 700; line-height: 1; }
.gf-ovr small { font-size: 8px; letter-spacing: .12em; opacity: .8; }

.gf-statstrip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px;
}
.gf-stat {
  background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r);
  padding: 8px 4px; text-align: center; min-width: 0;
}
.gf-stat .l { display: block; font-size: 9px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-dim); }
.gf-stat .v { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 700; margin-top: 2px; }
.gf-form { font-style: normal; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
           padding: 1px 3px; border-radius: 3px; margin-right: 1px; }
.gf-form.w { background: rgba(111,207,151,.2); color: var(--signal-lt); }
.gf-form.d { background: rgba(138,147,162,.2); color: var(--text-dim); }
.gf-form.l { background: rgba(255,107,107,.18); color: var(--bad); }

/* ---------- Fixture card ---------- */
.gf-fixture {
  background: linear-gradient(165deg, #1B5E3A, #12341F);
  border: 1px solid rgba(255,255,255,.1); border-radius: var(--r-lg);
  padding: 18px 16px; margin-bottom: 12px; text-align: center;
}
.gf-fixture.champ { background: linear-gradient(165deg, #4A3B12, #2A1F08); border-color: rgba(242,201,76,.4); }
.gf-fixture-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
                  color: var(--gold); margin-bottom: 10px; }
/* Stacked so a long club name never strands the "v" at the end of a line. */
.gf-fixture-teams { display: grid; justify-items: center; gap: 1px;
                    font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.25; }
.gf-fixture-teams .vs { color: rgba(255,255,255,.5); font-size: 12px; font-weight: 600;
                        text-transform: uppercase; letter-spacing: .1em; }
.gf-fixture-venue { font-size: 12px; color: rgba(255,255,255,.65); margin: 6px 0 16px; }
.gf-blocked { background: rgba(255,107,107,.14); border: 1px solid rgba(255,107,107,.3);
              border-radius: var(--r); padding: 12px; font-size: 13.5px; color: #FFC9C9; margin: 0 0 10px; }

/* ---------- Bars ---------- */
.gf-bar-track { background: rgba(0,0,0,.35); border-radius: 999px; height: 10px;
                overflow: hidden; border: 1px solid var(--edge); }
.gf-bar-fill { height: 100%; border-radius: 999px;
               background: linear-gradient(90deg, var(--signal), var(--signal-lt)); transition: width .4s ease; }
.gf-bar-fill.energy { background: linear-gradient(90deg, #C06B31, var(--gold)); }
.gf-bar-fill.energy.low { background: linear-gradient(90deg, #C0392B, var(--bad)); }

.gf-row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.gf-row-between .k { font-size: 13.5px; font-weight: 700; }
.gf-row-between .v { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); text-align: right; }
.gf-injury { color: var(--bad); font-weight: 600; }

/* ---------- League table ---------- */
.gf-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
.gf-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.gf-table th { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim);
               font-weight: 700; padding: 6px 4px; text-align: center; }
.gf-table td { padding: 9px 4px; text-align: center; border-top: 1px solid var(--edge); font-family: var(--font-mono); }
.gf-table .tl { text-align: left; font-family: var(--font-body); }
.gf-table td.tl { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gf-table .pts { font-weight: 700; color: var(--text); }
.gf-table tr.me td { background: rgba(46,139,87,.16); color: #fff; font-weight: 700; }
.gf-table tr.promo td:first-child { box-shadow: inset 3px 0 0 var(--signal-lt); }
.gf-table tr.releg td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.gf-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
.gf-legend .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.gf-legend .sw.promo { background: var(--signal-lt); }
.gf-legend .sw.releg { background: var(--bad); }

/* ---------- Ladder ---------- */
.gf-ladder { display: flex; flex-direction: column; gap: 3px; }
.gf-ladder-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
                  padding: 6px 8px; border-radius: 8px; color: var(--text-dim); }
.gf-ladder-step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--edge-lit); flex-shrink: 0; }
.gf-ladder-step.done { color: var(--text); }
.gf-ladder-step.done .dot { background: var(--signal-lt); }
.gf-ladder-step.current { background: rgba(46,139,87,.14); color: var(--text); font-weight: 700; }
.gf-ladder-step.current .dot { background: var(--gold); box-shadow: 0 0 0 4px rgba(242,201,76,.2); }

/* ---------- Attributes ---------- */
.gf-attr { margin-bottom: 11px; }
.gf-attr:last-child { margin-bottom: 0; }
.gf-attr-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
.gf-attr-head .name { font-size: 13px; font-weight: 600; }
.gf-attr-head .name .dim { font-size: 11px; font-weight: 400; }
.gf-attr-head .val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; }
.gf-attr-row { display: flex; align-items: center; gap: 10px; }
.gf-attr-row .gf-bar-track { flex: 1; height: 8px; }
.gf-upgrade-btn {
  flex-shrink: 0; min-width: 46px; height: 40px; border-radius: 10px;
  border: 1px solid var(--edge-lit); background: var(--surface-2); color: var(--text);
  font-weight: 700; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 2px;
}
.gf-upgrade-btn small { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); }
.gf-upgrade-btn:not(:disabled) { border-color: var(--signal); color: var(--signal-lt); }
.gf-upgrade-btn:active:not(:disabled) { transform: scale(.94); }
.gf-upgrade-btn:disabled { opacity: .3; }
.gf-tp { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2);
         border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }

/* ---------- Career record ---------- */
.gf-record { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gf-rec { background: var(--surface-2); border-radius: 10px; padding: 10px 6px; text-align: center; }
.gf-rec .n { display: block; font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
.gf-rec .l { display: block; font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-dim); margin-top: 2px; }

/* ---------- Setup ---------- */
.gf-setup { text-align: left; }
.gf-crest { font-size: 44px; text-align: center; margin-bottom: 4px; }
.gf-setup h1 { font-size: 30px; margin-bottom: 8px; text-align: center; }
.gf-setup > p.dim { margin: 0 0 20px; font-size: 14.5px; text-align: center; }
.gf-pos-grid { display: flex; flex-direction: column; gap: 8px; }
.gf-pos {
  width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r);
  background: var(--surface-2); border: 1px solid var(--edge); color: var(--text); cursor: pointer;
}
.gf-pos .n { display: block; font-weight: 700; font-size: 14.5px; }
.gf-pos .b { display: block; font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.gf-pos.on { border-color: var(--signal); background: rgba(46,139,87,.16); }
.gf-pos.on .n { color: var(--signal-lt); }

/* ---------- Log ---------- */
.gf-log { display: flex; flex-direction: column; gap: 7px; max-height: 320px; overflow-y: auto; }
.gf-log-item { font-size: 12.5px; line-height: 1.45; padding: 9px 11px; border-radius: 9px;
               background: var(--surface-2); border-left: 3px solid var(--edge-lit); }
.gf-log-item.win { border-left-color: var(--signal-lt); }
.gf-log-item.loss { border-left-color: var(--bad); }
.gf-log-item.motm { border-left-color: var(--gold); color: #FFE6A0; }
.gf-log-item.promo { border-left-color: var(--signal); color: #B7F0CE; font-weight: 600; }
.gf-log-item.trophy { border-left-color: var(--gold); background: rgba(242,201,76,.1); color: #FFE6A0; font-weight: 700; }
.gf-log-item.final { border-left-color: var(--signal); font-weight: 600; }
.gf-log-item.train { border-left-color: var(--signal-lt); color: var(--text-dim); }

/* ---------- Off-season panel ---------- */
.gf-final-panel {
  text-align: center; padding: 24px 16px; border-radius: var(--r-lg); margin-bottom: 12px;
  background: linear-gradient(160deg, rgba(46,139,87,.2), rgba(242,201,76,.1));
  border: 1px solid rgba(242,201,76,.4);
}
.gf-final-panel h2 { font-size: 21px; margin-bottom: 8px; }
.gf-final-panel p { color: var(--text-dim); font-size: 14px; margin: 0 0 16px; }

/* ---------- Bottom tab bar ---------- */
.gf-tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(14,17,22,.94); backdrop-filter: blur(14px);
  border-top: 1px solid var(--edge);
  padding-bottom: env(safe-area-inset-bottom);
}
.gf-tabbtn {
  min-height: var(--tabbar-h); border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-dim); font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
}
.gf-tabbtn span { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .65; }
.gf-tabbtn.on { color: var(--signal-lt); }
.gf-tabbtn.on span { filter: none; opacity: 1; }

/* ================= Match Day ================= */

.gf-match-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at top, #182338 0%, #0A0D12 75%);
  display: flex; align-items: center; justify-content: center;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  overflow-y: auto;
}
.gf-match-card {
  width: 100%; max-width: 460px; background: var(--surface);
  border: 1px solid var(--edge); border-radius: var(--r-lg); overflow: hidden;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
}
.gf-match-head { padding: 12px 16px 8px; text-align: center; }
.gf-match-tier { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
                 color: var(--gold); font-weight: 700; margin-bottom: 5px; }
/* Three columns keep the "v" centred between the teams; each name wraps
   inside its own cell rather than stranding the "v" at a line end. */
.gf-match-vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
               font-family: var(--font-display); }
.gf-match-vs .team.you { text-align: right; }
.gf-match-vs .team.rival { text-align: left; }
.gf-match-vs.solo { display: block; text-align: center; }
.gf-match-vs .team { font-weight: 800; font-size: 16px; }
.gf-match-vs .vs { color: var(--text-dim); font-size: 12px; font-weight: 600; }

.gf-pitch {
  position: relative; margin: 0 12px 12px; border-radius: var(--r); overflow: hidden;
  min-height: 340px; background: linear-gradient(160deg, #1B5E3A, #0F3D26);
  border: 1px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; justify-content: flex-end;
  touch-action: none; user-select: none;
}
.gf-pitch-stripes { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(100deg, rgba(255,255,255,.035) 0 40px, transparent 40px 80px); }
.gf-goal {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 84px; height: 40px; opacity: .8;
  border-left: 5px solid rgba(255,255,255,.75); border-right: 5px solid rgba(255,255,255,.75);
  border-top: 5px solid rgba(255,255,255,.75); border-radius: 2px 2px 0 0;
}
.gf-card-inner { position: relative; z-index: 2; padding: 12px; }

.gf-throwin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; }
.gf-throwin-text { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: #fff;
                   text-shadow: 0 4px 20px rgba(0,0,0,.6); animation: gf-throwin-pop .85s ease forwards; }
@keyframes gf-throwin-pop {
  0% { transform: scale(.4); opacity: 0; }
  30% { transform: scale(1.15); opacity: 1; }
  60% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

.gf-challenge { text-align: center; }
.gf-challenge-label { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
                      color: #fff; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
.gf-challenge-label span { display: block; font-size: 10.5px; color: var(--gold); margin-top: 2px; }
.gf-challenge.resolved .gf-timing-track,
.gf-challenge.resolved .gf-action-btn,
.gf-challenge.resolved .gf-swipe-area,
.gf-challenge.resolved .gf-pass-field,
.gf-challenge.resolved .gf-reaction-pad { opacity: .35; pointer-events: none; }

.gf-action-btn { max-width: 280px; margin: 0 auto; flex-direction: column; gap: 1px; }
.gf-key-hint { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }

.gf-rating-pop { margin-top: 10px; font-family: var(--font-display); font-weight: 800; font-size: 19px;
                 animation: gf-pop .5s ease forwards; }
.gf-rating-pop.r-perfect, .gf-rating-pop.r-great { color: var(--signal-lt); }
.gf-rating-pop.r-good { color: var(--gold); }
.gf-rating-pop.r-miss { color: var(--bad); }
@keyframes gf-pop { 0% { transform: scale(.6); opacity: 0; } 40% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* --- 1. Timing bar --- */
.gf-timing-track {
  position: relative; height: 44px; border-radius: 999px; margin-bottom: 14px;
  background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.15);
}
.gf-zone { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
.gf-zone.good { background: rgba(242,201,76,.16); }
.gf-zone.great { background: rgba(111,207,151,.32); }
.gf-zone.perfect { background: rgba(111,207,151,.85); box-shadow: 0 0 14px rgba(111,207,151,.6); }
.gf-timing-marker { position: absolute; top: 50%; font-size: 26px; line-height: 1;
                    transform: translate(-50%, -50%); filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.gf-timing-marker.locked { transition: transform .15s ease; transform: translate(-50%, -50%) scale(1.3); }

/* --- 2. Swipe kick --- */
.gf-swipe-area {
  position: relative; height: 210px; border-radius: var(--r); margin-bottom: 10px;
  background: rgba(0,0,0,.22); border: 1px dashed rgba(255,255,255,.2);
  touch-action: none; cursor: grab; overflow: hidden;
}
.gf-swipe-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.gf-swipe-ball { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
                 font-size: 30px; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.gf-swipe-target {
  position: absolute; left: 50%; bottom: 12%; width: 30px; height: 30px; margin-left: -15px;
  border-radius: 50%; border: 3px dashed var(--gold); transform-origin: center bottom;
  pointer-events: none; animation: gf-target-pulse 1.4s ease-in-out infinite;
}
@keyframes gf-target-pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
.gf-swipe-hint { position: absolute; top: 8px; left: 0; right: 0; text-align: center;
                 font-size: 11px; color: rgba(255,255,255,.55); pointer-events: none; }

/* --- 3. Tap rush --- */
.gf-rush-track { position: relative; height: 46px; margin-bottom: 10px; border-radius: var(--r);
                 background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.12); overflow: hidden; }

.gf-rush-def { bottom: 3px; opacity: .85; }
.gf-mash-btn { margin-top: 12px; }
.gf-mash-btn.pulse { animation: gf-mash 140ms ease; }
@keyframes gf-mash { 50% { transform: scale(.95); background: var(--signal-lt); } }

/* --- 4. Reaction --- */
.gf-reaction-pad {
  height: 190px; border-radius: var(--r); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; cursor: pointer;

  touch-action: none; user-select: none; transition: background .1s ease, border-color .1s ease;

.gf-reaction-pad.live { background: rgba(255,107,107,.35); border-color: var(--bad); }

/* --- 5. Pick the pass --- */

.gf-runner {

.gf-moment-flash {
  position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;

<body>
<div id="app"></div>
<script>
// Gaelic Hero — season structure: a 10-game divisional league (double
// round-robin between six teams), then a knockout championship.
//
// Promotion is earned only by winning your division. Finishing bottom
// relegates you. Pure logic — no DOM, no randomness beyond Math.random,
// so app.js/match.js can drive it and tests can drive it headlessly.

(function () {
  const TEAMS_PER_DIVISION = 6;
  const LEAGUE_ROUNDS = (TEAMS_PER_DIVISION - 1) * 2; // 10 games

  const CLUB_PREFIX = [
    "St. Brigid's", "Ballina", "Kilmacud", "Naomh Padraig", "Clonmel",
    "Ardnaree", "Rathmore", "Glenbeigh", "Carrickmore", "Ballyhaunis",
    "Dromore", "Killeenan", "Corofin", "Moycullen", "Castlebar",
  ];
  const CLUB_SUFFIX = [
    "Gaels", "Rovers", "Sarsfields", "Emmets", "Shamrocks", "Rangers",
    "Harps", "Wanderers", "Mitchels", "O'Connells", "Parnells", "Crokes",
  ];
  const COUNTY_POOL = [
    "Kerry", "Dublin", "Mayo", "Tyrone", "Donegal", "Galway", "Armagh",
    "Derry", "Cork", "Monaghan", "Kildare", "Roscommon", "Meath", "Clare",
    "Louth", "Cavan", "Down", "Westmeath", "Offaly", "Sligo", "Limerick",
  ];

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function pick(arr) {
    return arr[randInt(0, arr.length - 1)];
  }

  function genTeamNames(count, isCounty, excludeName) {
    const names = new Set();
    const pool = isCounty ? COUNTY_POOL : null;
    let guard = 0;
    while (names.size < count && guard++ < 500) {
      const n = isCounty ? pick(pool) : `${pick(CLUB_PREFIX)} ${pick(CLUB_SUFFIX)}`;
      if (n !== excludeName) names.add(n);
    }
    return [...names].slice(0, count);
  }

  /** Standard circle-method round robin. Returns rounds of [i, j] pairs. */
  function roundRobin(n) {
    const rounds = [];
    const arr = [...Array(n).keys()];
    for (let r = 0; r < n - 1; r++) {
      const pairs = [];
      for (let i = 0; i < n / 2; i++) pairs.push([arr[i], arr[n - 1 - i]]);
      rounds.push(pairs);
      const fixed = arr[0];
      const rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr.splice(0, arr.length, fixed, ...rest);
    }
    return rounds;
  }

  /** Builds a fresh 10-round fixture list. The player is always team 0. */
  function buildFixtures() {
    const first = roundRobin(TEAMS_PER_DIVISION);
    const fixtures = [];
    first.forEach((pairs) => {
      fixtures.push(pairs.map(([a, b]) => ({ home: a, away: b })));
    });
    first.forEach((pairs) => {
      fixtures.push(pairs.map(([a, b]) => ({ home: b, away: a })));
    });
    return fixtures;
  }

  function blankRow(name, strength, isPlayer) {
    return { name, strength, isPlayer: !!isPlayer, p: 0, w: 0, d: 0, l: 0, f: 0, a: 0, pts: 0 };
  }

  /** Creates the league for a tier: table rows, fixtures, round pointer. */
  function createLeague(tier, playerTeamName) {
    const isCounty = tier.level === "County";
    const names = genTeamNames(TEAMS_PER_DIVISION - 1, isCounty, playerTeamName);
    const table = [blankRow(playerTeamName, tier.oppBase, true)];
    names.forEach((n) => {
      table.push(blankRow(n, tier.oppBase + randInt(-7, 7), false));
    });
    return { table, fixtures: buildFixtures(), round: 0 };
  }

  function genScoreline(strength) {
    const total = Math.max(3, Math.round(strength / 4) + randInt(-4, 5));
    const maxGoals = Math.min(3, Math.floor(total / 6));
    const goals = maxGoals > 0 ? randInt(0, maxGoals) : 0;
    const points = Math.max(0, total - goals * 3);
    return { goals, points, total: goals * 3 + points };
  }

  function applyResult(row, forTotal, againstTotal) {
    row.p += 1;
    row.f += forTotal;
    row.a += againstTotal;
    if (forTotal > againstTotal) { row.w += 1; row.pts += 2; }
    else if (forTotal === againstTotal) { row.d += 1; row.pts += 1; }
    else { row.l += 1; }
  }

  function sortTable(table) {
    return [...table].sort((x, y) =>
      y.pts - x.pts ||
      (y.f - y.a) - (x.f - x.a) ||
      y.f - x.f ||
      x.name.localeCompare(y.name)
    );
  }

  function playerPosition(league) {
    return sortTable(league.table).findIndex((r) => r.isPlayer) + 1;
  }

  /** Who the player faces in the current league round. */
  function currentOpponent(league) {
    const round = league.fixtures[league.round];
    if (!round) return null;
    const fx = round.find((f) => f.home === 0 || f.away === 0);
    if (!fx) return null;
    const oppIdx = fx.home === 0 ? fx.away : fx.home;
    return { name: league.table[oppIdx].name, strength: league.table[oppIdx].strength, atHome: fx.home === 0 };
  }

  /**
   * Records the player's league result and simulates the other fixtures in
   * that round, then advances the round pointer.
   */
  function recordLeagueRound(league, yourTotal, oppTotal) {
    const round = league.fixtures[league.round];
    if (!round) return league;
    round.forEach((fx) => {
      const home = league.table[fx.home];
      const away = league.table[fx.away];
      if (fx.home === 0 || fx.away === 0) {
        const playerIsHome = fx.home === 0;
        const hFor = playerIsHome ? yourTotal : oppTotal;
        const aFor = playerIsHome ? oppTotal : yourTotal;
        applyResult(home, hFor, aFor);
        applyResult(away, aFor, hFor);
      } else {
        const hs = genScoreline(home.strength + 3).total; // slight home advantage
        const as = genScoreline(away.strength).total;
        applyResult(home, hs, as);
        applyResult(away, as, hs);
      }
    });
    league.round += 1;
    return league;
  }

  function leagueComplete(league) {
    return league.round >= LEAGUE_ROUNDS;
  }

  // ---------- Championship ----------

  const CHAMP_STAGES = ["Quarter-Final", "Semi-Final", "Final"];

  function createChampionship(tier, seedPosition) {
    // A strong league finish earns an easier draw.
    const handicap = Math.max(-6, 4 - seedPosition * 2);
    return {
      stageIndex: 0,
      eliminated: false,
      won: false,
      handicap,
      opponent: null,
    };
  }

  function championshipStageLabel(champ, tier) {
    if (tier.isTop && CHAMP_STAGES[champ.stageIndex] === "Final") return "All-Ireland Final";
    return CHAMP_STAGES[champ.stageIndex] || "Final";
  }

  function championshipOpponent(champ, tier, playerTeamName) {
    if (champ.opponent) return champ.opponent;
    const isCounty = tier.level === "County";
    const name = genTeamNames(1, isCounty, playerTeamName)[0];
    // Opposition sharpens as the rounds go on.
    const strength = tier.oppBase + 3 + champ.stageIndex * 4 - champ.handicap;
    champ.opponent = { name, strength };
    return champ.opponent;
  }

  function recordChampionshipResult(champ, won) {
    champ.opponent = null;
    if (!won) {
      champ.eliminated = true;
      return champ;
    }
    if (champ.stageIndex >= CHAMP_STAGES.length - 1) {
      champ.won = true;
      return champ;
    }
    champ.stageIndex += 1;
    return champ;
  }

  function championshipComplete(champ) {
    return champ.eliminated || champ.won;
  }

  window.GaaSeason = {
    TEAMS_PER_DIVISION,
    LEAGUE_ROUNDS,
    CHAMP_STAGES,
    createLeague,
    sortTable,
    playerPosition,
    currentOpponent,
    recordLeagueRound,
    leagueComplete,
    genScoreline,
    createChampionship,
    championshipStageLabel,
    championshipOpponent,
    recordChampionshipResult,
    championshipComplete,
    genTeamNames,
  };
})();

</script>
<script>

(function () {
  const ACHIEVEMENTS = [

    { key: "firstwin",   name: "Off the Mark",     desc: "Win your first match",             test: (c) => c.wins >= 1 },
    { key: "firstgoal",  name: "Green Flag",       desc: "Score your first goal",            test: (c) => c.goals >= 1 },
    { key: "motm1",      name: "Star Man",         desc: "Win Man of the Match",             test: (c) => c.motm >= 1 },
    { key: "motm10",     name: "Talisman",         desc: "Win 10 Man of the Match awards",   test: (c) => c.motm >= 10 },
    { key: "league1",    name: "Division Winners", desc: "Win a divisional league",          test: (c) => c.leaguesWon >= 1 },

    { key: "allstar",    name: "All Star",         desc: "Be named in the Team of the Year", test: (c) => c.allStars >= 1 },
    { key: "century",    name: "Centurion",        desc: "Play 100 matches",                 test: (c) => c.matches >= 100 },
    { key: "sharp",      name: "Sharpshooter",     desc: "Score 100 career points",          test: (c) => c.points >= 100 },
    { key: "ovr80",      name: "Complete Player",  desc: "Reach an overall rating of 80",    test: (c, s, ovr) => ovr >= 80 },
    { key: "loyal",      name: "Ten Seasons",      desc: "Play ten seasons",                 test: (c, s) => s.season >= 10 },
  ];

  /** Returns any achievements newly unlocked by the current state. */
  function checkAchievements(state, overall) {
    const have = new Set(state.achievements || []);
    return ACHIEVEMENTS.filter((a) => !have.has(a.key) && a.test(state.career, state, overall));
  }

  // Season objectives — the manager's expectation for the year. Targets get
  // harder the higher you climb.
  function createObjective(tierIndex) {
    if (tierIndex === 0) {
      return { target: 3, desc: "Finish in the top 3 of the division", reward: 8 };
    }
    if (tierIndex < 4) {
      return { target: 2, desc: "Finish in the top 2 and push for promotion", reward: 12 };
    }
    return { target: 1, desc: "Win the division", reward: 18 };
  }

  function objectiveMet(objective, finishPos) {
    return !!objective && finishPos <= objective.target;
  }

  window.GaaProgress = { ACHIEVEMENTS, checkAchievements, createObjective, objectiveMet };
})();

</script>
<script>
// Gaelic Hero — game data & pure logic.
// No DOM access here: every function takes the current save-state and
// returns a brand new state (plus log entries). app.js owns rendering.

(function () {
  const S = window.GaaSeason;
  const P = window.GaaProgress;

  const COUNTIES = [
    "Antrim", "Armagh", "Carlow", "Cavan", "Clare", "Cork", "Derry", "Donegal",
    "Down", "Dublin", "Fermanagh", "Galway", "Kerry", "Kildare", "Kilkenny",
    "Laois", "Leitrim", "Limerick", "Longford", "Louth", "Mayo", "Meath",
    "Monaghan", "Offaly", "Roscommon", "Sligo", "Tipperary", "Tyrone",
    "Waterford", "Westmeath", "Wexford", "Wicklow",
  ];

  const ATTRS = [
    { key: "kicking", label: "Kicking", hint: "Shot power" },
    { key: "fielding", label: "High Fielding", hint: "Catching" },
    { key: "tackling", label: "Tackling", hint: "Turnovers" },
    { key: "speed", label: "Pace", hint: "Solo runs" },
    { key: "strength", label: "Physicality", hint: "Holding out" },
    { key: "stamina", label: "Stamina", hint: "Energy drain" },
    { key: "freeTaking", label: "Free-Taking", hint: "Placed balls" },
    { key: "vision", label: "Vision", hint: "Passing" },
    { key: "reflexes", label: "Reflexes", hint: "Blocks" },
  ];

  // Positions bias which match events you see and which attributes carry them.
  const POSITIONS = [
    { key: "ff", label: "Full-Forward", blurb: "Score-hungry. Lives on shots and frees.",
      weights: { shot: 4, free: 2, catch: 1, pass: 1, sprint: 1, tackle: 0, block: 0 } },
    { key: "hf", label: "Half-Forward", blurb: "Runs hard, links play, chips in scores.",
      weights: { shot: 2, free: 1, catch: 1, pass: 3, sprint: 3, tackle: 1, block: 0 } },
    { key: "mf", label: "Midfield", blurb: "Engine room. Kickouts, catches, box-to-box.",
      weights: { shot: 1, free: 0, catch: 4, pass: 2, sprint: 2, tackle: 2, block: 1 } },
    { key: "hb", label: "Half-Back", blurb: "Wins it back and drives out of defence.",
      weights: { shot: 1, free: 0, catch: 2, pass: 2, sprint: 2, tackle: 3, block: 2 } },
    { key: "fb", label: "Full-Back", blurb: "Last line. Blocks, tackles, no passengers.",
      weights: { shot: 0, free: 0, catch: 2, pass: 1, sprint: 0, tackle: 4, block: 4 } },
  ];

  // The ladder. Promotion comes only from winning your division; finishing
  // bottom sends you down. The top tier has no promotion — only Sam Maguire.
  const TIERS = [
    { key: "jb", label: "Junior B", division: "Junior B Division", level: "Club", oppBase: 28,
      champLabel: "Junior B Championship" },
    { key: "ja", label: "Junior A", division: "Junior A Division", level: "Club", oppBase: 36,
      champLabel: "Junior A Championship" },
    { key: "im", label: "Intermediate", division: "Intermediate Division", level: "Club", oppBase: 45,
      champLabel: "Intermediate Championship" },
    { key: "sr", label: "Senior Club", division: "Senior Club Division", level: "Club", oppBase: 54,
      champLabel: "Senior Club Championship",
      promoNote: "Winning the Senior division earns a call-up to the county panel." },
    { key: "d4", label: "County Div. 4", division: "National League Div. 4", level: "County", oppBase: 61,
      champLabel: "Tailteann Cup" },
    { key: "d3", label: "County Div. 3", division: "National League Div. 3", level: "County", oppBase: 67,
      champLabel: "All-Ireland Qualifiers" },
    { key: "d2", label: "County Div. 2", division: "National League Div. 2", level: "County", oppBase: 73,
      champLabel: "All-Ireland Series" },
    { key: "d1", label: "County Div. 1", division: "National League Div. 1", level: "County", oppBase: 79,
      champLabel: "All-Ireland Championship", isTop: true },
  ];

  const TOP_TIER = TIERS.length - 1;

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function cryptoId() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function computeOverall(attributes) {
    const total = ATTRS.reduce((sum, a) => sum + attributes[a.key], 0);
    return Math.round(total / ATTRS.length);
  }

  function upgradeCost(value) {
    if (value >= 99) return Infinity;
    return 1 + Math.floor(value / 20);
  }

  function teamName(state) {
    return TIERS[state.tierIndex].level === "County" ? state.county : state.club;
  }

  function scoreString(s) {
    return `${s.goals}-${String(s.points).padStart(2, "0")}`;
  }

  function pushLog(events, entry) {
    events.push({ id: cryptoId(), ...entry });
  }
  function withLog(state, events) {
    return { ...state, log: [...events.slice().reverse(), ...state.log].slice(0, 40) };
  }

  function createCareer({ name, county, club, positionKey }) {
    const position = POSITIONS.find((p) => p.key === positionKey) || POSITIONS[0];
    const attributes = {};
    ATTRS.forEach((a) => { attributes[a.key] = randInt(30, 40); });

    const cleanName = (name || "").trim() || "New Player";
    const cleanClub = (club || "").trim() || `${county} Gaels`;

    const state = {
      name: cleanName,
      county,
      club: cleanClub,
      position: position.key,
      attributes,
      trainingPoints: 6,
      energy: 100,
      tierIndex: 0,
      season: 1,
      phase: "league",
      championship: null,
      form: [],
      injury: null,
      career: {
        matches: 0, wins: 0, draws: 0, losses: 0, motm: 0,
        goals: 0, points: 0,
        leaguesWon: 0, promotions: 0, relegations: 0,
        championships: 0, allIrelands: 0, allStars: 0,
      },
      achievements: [],
      seenGames: {},                       // mini-games already explained
      settings: { sound: true, haptics: true },
      objective: P.createObjective(0),
      log: [{ id: cryptoId(), type: "info",
        text: `${cleanName} signed on at ${cleanClub}, ${position.label} on the Junior B panel. Ten league games to prove it.` }],
    };
    state.league = S.createLeague(TIERS[0], teamName(state));
    return state;
  }

  /** Records that a mini-game's coach card has been shown. */
  function markGameSeen(state, key) {
    if (state.seenGames && state.seenGames[key]) return state;
    return { ...state, seenGames: { ...(state.seenGames || {}), [key]: true } };
  }

  function toggleSetting(state, key) {
    const settings = { ...(state.settings || {}), [key]: !(state.settings || {})[key] };
    return { ...state, settings };
  }

  /** Awards any achievements the state has just unlocked. */
  function awardAchievements(state, events) {
    const unlocked = P.checkAchievements(state, computeOverall(state.attributes));
    if (!unlocked.length) return state;
    unlocked.forEach((a) => {
      pushLog(events, { type: "trophy", text: `ACHIEVEMENT — ${a.name}: ${a.desc}.` });
    });
    return { ...state, achievements: [...(state.achievements || []), ...unlocked.map((a) => a.key)] };
  }

  // ---------- Match resolution ----------

  /**
   * Turns the mini-game ratings captured during a match into score deltas
   * and a 0-100 skillIndex. Defaults to a neutral contribution so the
   * season can still be driven headlessly in tests.
   */
  function resolvePlayerEvents(events) {
    if (!events || !events.length) {
      return { yourBonus: { goals: 0, points: 0 }, oppBonus: { goals: 0, points: 0 }, skillIndex: 50 };
    }
    let yg = 0, yp = 0, og = 0, op = 0;
    events.forEach((ev) => {
      const s = ev.score;
      switch (ev.type) {
        case "shot":
          if (s >= 85) { if (Math.random() < 0.4) yg += 1; else yp += 1; }
          else if (s >= 60) yp += 1;
          else if (s < 35 && Math.random() < 0.3) op += 1;
          break;
        case "free":
          if (s >= 55) yp += 1;
          break;
        case "catch":
          if (s >= 60 && Math.random() < 0.4) yp += 1;
          else if (s < 35 && Math.random() < 0.35) op += 1;
          break;
        case "pass":
          if (s >= 70 && Math.random() < 0.55) yp += 1;
          else if (s < 35 && Math.random() < 0.3) op += 1;
          break;
        case "sprint":
          if (s >= 75 && Math.random() < 0.5) yp += 1;
          else if (s < 30 && Math.random() < 0.25) op += 1;
          break;
        case "tackle":
          if (s < 35 && Math.random() < 0.5) op += 1;
          else if (s >= 85 && Math.random() < 0.2) yp += 1;
          break;
        case "block":
          if (s >= 60) { if (Math.random() < 0.35) op -= 1; }
          else if (s < 35) { if (Math.random() < 0.4) og += 1; else op += 1; }
          break;
      }
    });
    const skillIndex = Math.round(events.reduce((sum, ev) => sum + ev.score, 0) / events.length);
    return {
      yourBonus: { goals: yg, points: Math.max(0, yp) },
      oppBonus: { goals: Math.max(0, og), points: Math.max(0, op) },
      skillIndex,
    };
  }

  function buildScore(strength, bonus) {
    const s = S.genScoreline(strength);
    s.goals += bonus.goals;
    s.points += bonus.points;
    s.goals = Math.max(0, s.goals);
    s.points = Math.max(0, s.points);
    s.total = s.goals * 3 + s.points;
    return s;
  }

  /**
   * Resolves one match — league or championship — from the player's
   * mini-game contribution, advancing the season as needed.
   */
  function playFixture(state, contribution, meta) {
    const { yourBonus, oppBonus, skillIndex } = contribution || resolvePlayerEvents(null);
    const tier = TIERS[state.tierIndex];
    const overall = computeOverall(state.attributes);
    const fatigue = state.energy < 30 ? 8 : state.energy < 55 ? 3 : 0;

    const yourScore = buildScore(overall - fatigue + randInt(-5, 5), yourBonus);
    const oppScore = buildScore(meta.oppStrength + randInt(-6, 6), oppBonus);

    const result = yourScore.total > oppScore.total ? "win"
      : yourScore.total < oppScore.total ? "loss" : "draw";

    const margin = yourScore.total - oppScore.total;
    const motmChance = 0.1 + Math.max(0, skillIndex - 50) / 160 + (margin >= 6 ? 0.12 : 0);
    const motm = result === "win" && Math.random() < motmChance;

    const skillMult = 0.6 + skillIndex / 90;
    const tierMult = 1 + state.tierIndex * 0.13;
    const tpEarned = Math.max(1, Math.round(
      (2 + (result === "win" ? 3 : result === "draw" ? 1 : 0) + (motm ? 2 : 0)) * skillMult * tierMult
    ));

    const staminaRelief = Math.round(state.attributes.stamina / 25);
    const energyCost = Math.max(6, 16 - staminaRelief);

    const events = [];
    const newState = {
      ...state,
      energy: Math.max(0, state.energy - energyCost),
      trainingPoints: state.trainingPoints + tpEarned,
      form: [result === "win" ? "W" : result === "draw" ? "D" : "L", ...state.form].slice(0, 5),
      career: {
        ...state.career,
        matches: state.career.matches + 1,
        wins: state.career.wins + (result === "win" ? 1 : 0),
        draws: state.career.draws + (result === "draw" ? 1 : 0),
        losses: state.career.losses + (result === "loss" ? 1 : 0),
        motm: state.career.motm + (motm ? 1 : 0),
        goals: state.career.goals + yourBonus.goals,
        points: state.career.points + yourBonus.points,
      },
    };

    const verb = result === "win" ? "beat" : result === "loss" ? "lost to" : "drew with";
    pushLog(events, {
      type: result === "win" ? "win" : result === "loss" ? "loss" : "draw",
      text: `${meta.label}: ${teamName(state)} ${scoreString(yourScore)} ${verb} ${meta.oppName} ${scoreString(oppScore)}.`,
    });
    if (motm) pushLog(events, { type: "motm", text: "Man of the Match — you ran the show." });

    // Knocks are more likely when you play on empty.
    if (state.energy < 25 && Math.random() < 0.22) {
      const knock = ["a hamstring strain", "a dead leg", "a rolled ankle", "a rib knock"][randInt(0, 3)];
      newState.injury = { games: randInt(1, 2), label: knock };
      pushLog(events, { type: "loss", text: `You picked up ${knock} — out for ${newState.injury.games} game(s).` });
    }

    return {
      state: newState,
      events,
      summary: { yourScore, oppScore, result, motm, tpEarned, skillIndex, label: meta.label, oppName: meta.oppName },
    };
  }

  // ---------- League ----------

  function nextLeagueFixture(state) {
    const opp = S.currentOpponent(state.league);
    if (!opp) return null;
    return {
      label: `${TIERS[state.tierIndex].division} · Round ${state.league.round + 1}`,
      oppName: opp.name,
      oppStrength: opp.strength,
      atHome: opp.atHome,
    };
  }

  function playLeagueMatch(state, contribution) {
    const meta = nextLeagueFixture(state);
    if (!meta) return state;

    const { state: afterMatch, events, summary } = playFixture(state, contribution, meta);
    const league = JSON.parse(JSON.stringify(afterMatch.league));
    S.recordLeagueRound(league, summary.yourScore.total, summary.oppScore.total);

    let next = { ...afterMatch, league };
    next.lastMatchSummary = { ...summary, kind: "league" };

    if (S.leagueComplete(league)) {
      next = concludeLeague(next, events);
    }
    next = awardAchievements(next, events);
    return withLog(next, events);
  }

  /** End of the 10-game league: decide promotion, relegation, championship seeding. */
  function concludeLeague(state, events) {
    const tier = TIERS[state.tierIndex];
    const pos = S.playerPosition(state.league);
    const won = pos === 1;
    const relegated = pos === S.TEAMS_PER_DIVISION && state.tierIndex > 0;
    const canPromote = state.tierIndex < TOP_TIER;

    pushLog(events, {
      type: won ? "trophy" : "info",
      text: `${tier.division} final table: you finished ${ordinal(pos)} of ${S.TEAMS_PER_DIVISION}.`,
    });

    const career = { ...state.career };
    let pendingTierChange = 0;

    if (won) {
      career.leaguesWon += 1;
      if (canPromote) {
        pendingTierChange = 1;
        career.promotions += 1;
        pushLog(events, { type: "trophy", text: `DIVISION WINNERS! ${tier.promoNote || `Promoted to ${TIERS[state.tierIndex + 1].division}.`}` });
      } else {
        pushLog(events, { type: "trophy", text: "DIVISION 1 LEAGUE CHAMPIONS! Nothing above this but Sam." });
      }
    } else if (relegated) {
      pendingTierChange = -1;
      career.relegations += 1;
      pushLog(events, { type: "loss", text: `Bottom of the table — relegated to ${TIERS[state.tierIndex - 1].division}.` });
    } else {
      pushLog(events, { type: "info", text: "Mid-table finish — no movement. The Championship is your second chance." });
    }

    // The manager's target for the year.
    let trainingPoints = state.trainingPoints;
    if (state.objective) {
      if (P.objectiveMet(state.objective, pos)) {
        trainingPoints += state.objective.reward;
        pushLog(events, { type: "promo",
          text: `Season objective met — "${state.objective.desc}". The manager hands you ${state.objective.reward} extra training points.` });
      } else {
        pushLog(events, { type: "info",
          text: `Season objective missed — "${state.objective.desc}".` });
      }
    }

    pushLog(events, { type: "promo", text: `${tier.champLabel} starts now. Knockout football — win or your season is over.` });

    return {
      ...state,
      trainingPoints,
      career,
      phase: "championship",
      pendingTierChange,
      championship: S.createChampionship(tier, pos),
      leagueFinishPos: pos,
    };
  }

  // ---------- Championship ----------

  function nextChampionshipFixture(state) {
    const tier = TIERS[state.tierIndex];
    const champ = state.championship;
    if (!champ || S.championshipComplete(champ)) return null;
    const opp = S.championshipOpponent(champ, tier, teamName(state));
    return {
      label: `${tier.champLabel} · ${S.championshipStageLabel(champ, tier)}`,
      oppName: opp.name,
      oppStrength: opp.strength,
      isFinal: S.championshipStageLabel(champ, tier).includes("Final"),
    };
  }

  function playChampionshipMatch(state, contribution) {
    const meta = nextChampionshipFixture(state);
    if (!meta) return state;

    const tier = TIERS[state.tierIndex];
    let { state: afterMatch, events, summary } = playFixture(state, contribution, meta);

    // Knockout football: a draw goes to extra time, decided on the day.
    let result = summary.result;
    if (result === "draw") {
      const edge = computeOverall(state.attributes) + summary.skillIndex / 4 - meta.oppStrength;
      const win = Math.random() < 0.5 + Math.max(-0.25, Math.min(0.25, edge / 60));
      result = win ? "win" : "loss";
      if (win) summary.yourScore.points += 1; else summary.oppScore.points += 1;
      summary.yourScore.total = summary.yourScore.goals * 3 + summary.yourScore.points;
      summary.oppScore.total = summary.oppScore.goals * 3 + summary.oppScore.points;
      summary.result = result;
      pushLog(events, { type: "final", text: `Level at full time — settled in extra time.` });
    }

    const champ = JSON.parse(JSON.stringify(afterMatch.championship));
    S.recordChampionshipResult(champ, result === "win");

    let next = { ...afterMatch, championship: champ };
    next.lastMatchSummary = { ...summary, kind: "championship", stageLabel: meta.label };

    if (champ.won) {
      const career = { ...next.career, championships: next.career.championships + 1 };
      if (tier.isTop) {
        career.allIrelands += 1;
        pushLog(events, { type: "trophy", text: `SAM MAGUIRE IS COMING HOME! ${state.county} are All-Ireland Champions.` });
      } else {
        pushLog(events, { type: "trophy", text: `${tier.champLabel} WINNERS! Silverware for ${teamName(state)}.` });
      }
      next = { ...next, career, doubleWon: next.doubleWon || state.leagueFinishPos === 1 };
      next.lastMatchSummary.championshipWon = true;
      next.lastMatchSummary.allIreland = !!tier.isTop;
    } else if (champ.eliminated) {
      pushLog(events, { type: "loss", text: `Knocked out of the ${tier.champLabel}. Season over.` });
      next.lastMatchSummary.eliminated = true;
    }

    if (S.championshipComplete(champ)) {
      next = { ...next, phase: "offseason" };
    }
    next = awardAchievements(next, events);
    return withLog(next, events);
  }

  // ---------- Off-season ----------

  function startNextSeason(state) {
    const events = [];
    const oldTier = TIERS[state.tierIndex];
    const overall = computeOverall(state.attributes);
    const change = state.pendingTierChange || 0;
    const newTierIndex = Math.max(0, Math.min(TOP_TIER, state.tierIndex + change));

    // All Stars are a season-long award, weighted by level and what you won.
    const champ = state.championship || {};
    const levelBonus = state.tierIndex >= 4 ? (state.tierIndex - 3) * 0.06 : -0.15;
    const allStarChance = Math.min(0.75, Math.max(0, (overall - 58) / 80 + levelBonus
      + (champ.won ? 0.2 : 0) + (state.leagueFinishPos === 1 ? 0.12 : 0)));
    const wonAllStar = Math.random() < allStarChance;

    const career = { ...state.career, allStars: state.career.allStars + (wonAllStar ? 1 : 0) };
    if (wonAllStar) {
      pushLog(events, { type: "trophy", text: `ALL STAR! You're named in the Team of the Year at ${oldTier.level.toLowerCase()} level.` });
    }

    if (change > 0) pushLog(events, { type: "promo", text: `Season ${state.season + 1}: up to ${TIERS[newTierIndex].division}.` });
    else if (change < 0) pushLog(events, { type: "loss", text: `Season ${state.season + 1}: down to ${TIERS[newTierIndex].division}.` });
    else pushLog(events, { type: "info", text: `Season ${state.season + 1} begins in ${TIERS[newTierIndex].division}.` });

    let next = {
      ...state,
      tierIndex: newTierIndex,
      season: state.season + 1,
      phase: "league",
      championship: null,
      pendingTierChange: 0,
      leagueFinishPos: null,
      energy: 100,
      injury: null,
      form: [],
      career,
      trainingPoints: state.trainingPoints + 6,
      lastSeasonAllStar: wonAllStar,
      doubleWon: false,
      objective: P.createObjective(newTierIndex),
    };
    next.league = S.createLeague(TIERS[newTierIndex], teamName(next));
    pushLog(events, { type: "info", text: `Manager's target: ${next.objective.desc}.` });
    next = awardAchievements(next, events);
    return withLog(next, events);
  }

  /**
   * Repairs a save that stalled between phases. If a phase transition ever
   * fails part-way, the save can point at a stage with no fixtures left,
   * which strands the player on a screen with no way forward. Called on load
   * so a stuck career heals itself instead of needing a reset.
   */
  function reconcile(state) {
    if (!state || !state.league) return state;
    const events = [];
    let next = state;

    if (next.phase === "league" && S.leagueComplete(next.league)) {
      next = concludeLeague(next, events);
    }
    if (next.phase === "championship" &&
        (!next.championship || S.championshipComplete(next.championship))) {
      next = { ...next, phase: "offseason" };
    }
    if (!["league", "championship", "offseason"].includes(next.phase)) {
      next = { ...next, phase: "league" };
    }
    return events.length ? withLog(next, events) : next;
  }

  // ---------- Player actions ----------

  function upgradeAttribute(state, key) {
    const value = state.attributes[key];
    const cost = upgradeCost(value);
    if (!Number.isFinite(cost) || state.trainingPoints < cost) return state;
    const label = (ATTRS.find((a) => a.key === key) || {}).label || key;
    const events = [];
    pushLog(events, { type: "train", text: `${label} up to ${value + 1}.` });
    const upgraded = awardAchievements({
      ...state,
      trainingPoints: state.trainingPoints - cost,
      attributes: { ...state.attributes, [key]: value + 1 },
    }, events);
    return withLog(upgraded, events);
  }

  function restUp(state) {
    const events = [];
    const recovery = 35 + Math.round(state.attributes.stamina / 4);
    const injury = state.injury
      ? (state.injury.games > 1 ? { ...state.injury, games: state.injury.games - 1 } : null)
      : null;
    if (state.injury && !injury) pushLog(events, { type: "info", text: "Passed fit — you're available again." });
    else if (injury) pushLog(events, { type: "info", text: `Still carrying ${injury.label}. ${injury.games} game(s) to go.` });
    else pushLog(events, { type: "info", text: "Recovery week — legs feel fresh again." });
    return withLog({ ...state, energy: Math.min(100, state.energy + recovery), injury }, events);
  }

  function ordinal(n) {
    const s = ["th", "st", "nd", "rd"];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  window.GaaCareer = {
    COUNTIES, ATTRS, POSITIONS, TIERS, TOP_TIER,
    computeOverall, upgradeCost, createCareer, teamName, scoreString, ordinal,
    resolvePlayerEvents,
    nextLeagueFixture, playLeagueMatch,
    nextChampionshipFixture, playChampionshipMatch,
    startNextSeason,
    upgradeAttribute, restUp,
    markGameSeen, toggleSetting, awardAchievements, reconcile,
  };
})();

</script>
