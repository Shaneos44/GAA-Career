<script>
// Gaelic Hero — tiny procedural sound effects via WebAudio.
// No audio files: everything here is a couple of oscillators/noise bursts.
// Safe to call from anywhere; silently no-ops if WebAudio is unavailable
// or the context hasn't been unlocked by a user gesture yet.

(function () {
  let ctx = null;
  let muted = false;

  function getCtx() {
    if (muted) return null;
    if (ctx) return ctx;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    ctx = new Ctx();
    return ctx;
  }

  function unlock() {
    const c = getCtx();
    if (c && c.state === "suspended") c.resume();
  }

  function tone(freq, start, dur, { type = "sine", gain = 0.18, glideTo = null } = {}) {
    const c = getCtx();
    if (!c) return;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + start);
    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, c.currentTime + start + dur);
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    osc.connect(g).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.02);
  }

  function noiseBurst(start, dur, { gain = 0.15, filterFreq = 1800 } = {}) {
    const c = getCtx();
    if (!c) return;
    const bufferSize = Math.floor(c.sampleRate * dur);
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buffer;
    const filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = filterFreq;
    const g = c.createGain();
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + start + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    src.connect(filter).connect(g).connect(c.destination);
    src.start(c.currentTime + start);
  }

  const SFX = {
    unlock,
    setMuted(v) { muted = !!v; },
    isMuted() { return muted; },
    whistle() {
      tone(2200, 0, 0.16, { type: "square", gain: 0.1 });
      tone(2200, 0.2, 0.28, { type: "square", gain: 0.1 });
    },
    tick() {
      tone(900, 0, 0.05, { type: "square", gain: 0.06 });
    },
    kick() {
      tone(140, 0, 0.12, { type: "triangle", gain: 0.22, glideTo: 60 });
      noiseBurst(0, 0.08, { gain: 0.1, filterFreq: 2500 });
    },
    perfect() {
      tone(880, 0, 0.1, { type: "sine", gain: 0.16 });
      tone(1320, 0.09, 0.14, { type: "sine", gain: 0.16 });
      tone(1760, 0.18, 0.22, { type: "sine", gain: 0.16 });
    },
    miss() {
      tone(220, 0, 0.28, { type: "sawtooth", gain: 0.12, glideTo: 110 });
    },
    cheer() {
      noiseBurst(0, 0.9, { gain: 0.14, filterFreq: 1400 });
      tone(220, 0, 0.6, { type: "sine", gain: 0.08, glideTo: 260 });
    },
    trophy() {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, { type: "sine", gain: 0.15 }));
    },
  };

  window.GaaAudio = SFX;
})();

</script>
<script>
// Gaelic Hero — a tiny canvas confetti burst, no external libraries.

(function () {
  const COLORS = ["#F2C94C", "#2E8B57", "#6FCF97", "#EDF0F4", "#C06B31"];

  function burst({ duration = 2200, particleCount = 140 } = {}) {
    const canvas = document.createElement("canvas");
    canvas.className = "gf-confetti-canvas";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");

    const particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vy: 2 + Math.random() * 3,
        vx: -1.5 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4,
      });
    }

    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    requestAnimationFrame(frame);
  }

  window.GaaConfetti = { burst };
})();

</script>
<script>
// Gaelic Hero — the skill layer. Six distinct touch-first mini-games.
//
// Every game resolves to { score, rating } where score is 0-100, so match.js
// can treat them interchangeably. All input is pointer-based (one code path
// for touch and mouse); the keyboard is only ever a convenience alias.

(function () {
  const A = window.GaaAudio;

  const RATING_LABELS = { perfect: "PERFECT!", great: "GREAT!", good: "OK", miss: "MISS!" };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function rate(score) {
    if (score >= 88) return "perfect";
    if (score >= 66) return "great";
    if (score >= 38) return "good";
    return "miss";
  }

  let hapticsOn = true;

  function buzz(rating) {
    if (!hapticsOn || !navigator.vibrate) return;
    if (rating === "perfect") navigator.vibrate([18, 40, 18]);
    else if (rating === "miss") navigator.vibrate(90);
    else navigator.vibrate(14);
  }

  /** Shared shell: mounts the game, then resolves after showing its rating. */
  function shell(card, html, setup) {
    return new Promise((resolve) => {
      const wrap = document.createElement("div");
      wrap.className = "gf-challenge";
      wrap.innerHTML = html;
      card.appendChild(wrap);

      let settled = false;
      function finish(score) {
        if (settled) return;
        settled = true;
        const clamped = clamp(Math.round(score), 0, 100);
        const rating = rate(clamped);

        cleanup();
        wrap.classList.add("resolved");
        if (rating === "perfect") A.perfect();
        else if (rating === "miss") A.miss();
        else A.tick();
        buzz(rating);

        const pop = document.createElement("div");
        pop.className = `gf-rating-pop r-${rating}`;
        pop.textContent = RATING_LABELS[rating];
        wrap.appendChild(pop);

        setTimeout(() => {
          wrap.remove();
          resolve({ score: clamped, rating });
        }, 520);
      }

      const cleanup = setup(wrap, finish) || (() => {});
    });
  }

  // ---------- 1. Timing bar — sweep a marker into the zone ----------

  function timingBar({ card, label, sub, zoneWidthPct, periodMs, timeoutMs = 3400, icon = "⚽" }) {
    const zoneCenter = 22 + Math.random() * 56;
    const perfectHalf = zoneWidthPct * 0.35;
    const greatHalf = zoneWidthPct;
    const goodHalf = zoneWidthPct * 1.9;

    return shell(card, `
      <div class="gf-challenge-label">${label}${sub ? `<span>${sub}</span>` : ""}</div>
      <div class="gf-timing-track">
        <div class="gf-zone good" style="left:${clamp(zoneCenter - goodHalf, 0, 100)}%;width:${goodHalf * 2}%"></div>
        <div class="gf-zone great" style="left:${clamp(zoneCenter - greatHalf, 0, 100)}%;width:${greatHalf * 2}%"></div>
        <div class="gf-zone perfect" style="left:${clamp(zoneCenter - perfectHalf, 0, 100)}%;width:${perfectHalf * 2}%"></div>
        <div class="gf-timing-marker">${icon}</div>
      </div>
      <button class="btn btn-primary gf-action-btn">STRIKE<span class="gf-key-hint">tap</span></button>
    `, (wrap, finish) => {
      const marker = wrap.querySelector(".gf-timing-marker");
      const btn = wrap.querySelector(".gf-action-btn");
      const start = performance.now();
      let raf, done = false;

      // Travel is inset to 3-97% so the marker never half-overflows the track.
      (function tick(now) {
        const t = (now || performance.now()) - start;
        marker.style.left = 50 + 47 * Math.sin((2 * Math.PI * t) / periodMs) + "%";
        if (!done) raf = requestAnimationFrame(tick);
      })();

      function strike(timedOut) {
        if (done) return;
        done = true;
        const pos = parseFloat(marker.style.left) || 50;
        const dist = Math.abs(pos - zoneCenter);
        let score;
        if (timedOut) score = 6;
        else if (dist <= perfectHalf) score = 100 - (dist / Math.max(perfectHalf, 0.001)) * 8;
        else if (dist <= greatHalf) score = 88 - ((dist - perfectHalf) / (greatHalf - perfectHalf)) * 20;
        else if (dist <= goodHalf) score = 64 - ((dist - greatHalf) / (goodHalf - greatHalf)) * 26;
        else score = Math.max(4, 30 - (dist - goodHalf));
        marker.classList.add("locked");
        finish(score);
      }

      const timer = setTimeout(() => strike(true), timeoutMs);
      const onKey = (e) => { if (e.code === "Space") { e.preventDefault(); strike(false); } };
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); strike(false); });
      document.addEventListener("keydown", onKey);

      return () => {
        done = true;
        clearTimeout(timer);
        cancelAnimationFrame(raf);
        document.removeEventListener("keydown", onKey);
      };
    });
  }

  // ---------- 2. Swipe kick — drag back and release to strike a free ----------

  function swipeKick({ card, label, sub, tolerance }) {
    const targetAngle = -90 + (Math.random() * 50 - 25); // degrees, up-ish
    const targetPower = 55 + Math.random() * 35;         // % of max drag

    return shell(card, `
      <div class="gf-challenge-label">${label}${sub ? `<span>${sub}</span>` : ""}</div>
      <div class="gf-swipe-area">
        <div class="gf-swipe-target" style="transform:rotate(${targetAngle + 90}deg) translateY(-${targetPower}%)"></div>
        <div class="gf-swipe-hint">drag from the ball &amp; release</div>
        <svg class="gf-swipe-line" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="50" y1="88" x2="50" y2="88" stroke="#F2C94C" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <div class="gf-swipe-ball">⚽</div>
      </div>
    `, (wrap, finish) => {
      const area = wrap.querySelector(".gf-swipe-area");
      const line = wrap.querySelector(".gf-swipe-line line");
      let dragging = false, origin = null;

      const maxDrag = () => Math.min(area.clientWidth, area.clientHeight) * 0.55;

      function down(e) {
        dragging = true;
        origin = { x: e.clientX, y: e.clientY };
        area.setPointerCapture && area.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
      function move(e) {
        if (!dragging) return;
        const dx = e.clientX - origin.x;
        const dy = e.clientY - origin.y;
        const r = area.getBoundingClientRect();
        // Aim is opposite the drag, like pulling back a slingshot.
        line.setAttribute("x2", clamp(50 - (dx / r.width) * 100, 0, 100));
        line.setAttribute("y2", clamp(88 - (dy / r.height) * 100, 0, 100));
        e.preventDefault();
      }
      function up(e) {
        if (!dragging) return;
        dragging = false;
        const dx = e.clientX - origin.x;
        const dy = e.clientY - origin.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 12) return; // a stray tap isn't a strike
        const angle = (Math.atan2(-dy, -dx) * 180) / Math.PI;
        const power = clamp((dist / maxDrag()) * 100, 0, 130);

        let angleErr = Math.abs(angle - targetAngle);
        if (angleErr > 180) angleErr = 360 - angleErr;
        const powerErr = Math.abs(power - targetPower);

        const angleScore = clamp(100 - (angleErr / tolerance.angle) * 100, 0, 100);
        const powerScore = clamp(100 - (powerErr / tolerance.power) * 100, 0, 100);
        finish(angleScore * 0.6 + powerScore * 0.4);
      }

      area.addEventListener("pointerdown", down);
      area.addEventListener("pointermove", move);
      area.addEventListener("pointerup", up);
      area.addEventListener("pointercancel", () => { dragging = false; });
      const timer = setTimeout(() => finish(8), 6000);

      return () => {
        clearTimeout(timer);
        area.removeEventListener("pointerdown", down);
        area.removeEventListener("pointermove", move);
        area.removeEventListener("pointerup", up);
      };
    });
  }

  // ---------- 3. Tap rush — mash to burst clear ----------

  function tapRush({ card, label, sub, targetTaps, durationMs = 3200 }) {
    return shell(card, `
      <div class="gf-challenge-label">${label}${sub ? `<span>${sub}</span>` : ""}</div>
      <div class="gf-rush-track">
        <div class="gf-rush-you" style="left:0%">🏃</div>
        <div class="gf-rush-def" style="left:0%">🛡️</div>
      </div>
      <div class="gf-bar-track"><div class="gf-bar-fill gf-rush-fill" style="width:0%"></div></div>
      <button class="btn btn-primary gf-action-btn gf-mash-btn">TAP! TAP! TAP!<span class="gf-key-hint">go</span></button>
    `, (wrap, finish) => {
      const btn = wrap.querySelector(".gf-mash-btn");
      const fill = wrap.querySelector(".gf-rush-fill");
      const you = wrap.querySelector(".gf-rush-you");
      const def = wrap.querySelector(".gf-rush-def");
      const start = performance.now();
      let taps = 0, raf, done = false;

      function onTap(e) {
        if (done) return;
        if (e) e.preventDefault();
        taps += 1;
        const pct = clamp((taps / targetTaps) * 100, 0, 100);
        fill.style.width = pct + "%";
        you.style.left = clamp(pct * 0.88, 0, 88) + "%";
        btn.classList.remove("pulse");
        void btn.offsetWidth;
        btn.classList.add("pulse");
      }

      (function tick(now) {
        const t = ((now || performance.now()) - start) / durationMs;
        def.style.left = clamp(t * 88, 0, 88) + "%";
        if (t >= 1) {
          done = true;
          finish(clamp((taps / targetTaps) * 100, 0, 100));
          return;
        }
        raf = requestAnimationFrame(tick);
      })();

      const onKey = (e) => { if (e.code === "Space") { e.preventDefault(); onTap(null); } };
      btn.addEventListener("pointerdown", onTap);
      document.addEventListener("keydown", onKey);

      return () => {
        done = true;
        cancelAnimationFrame(raf);
        btn.removeEventListener("pointerdown", onTap);
        document.removeEventListener("keydown", onKey);
      };
    });
  }

  // ---------- 4. Reaction — tap the instant the shot comes ----------

  function reactionTap({ card, label, sub, goodMs }) {
    const delay = 900 + Math.random() * 1800;
    return shell(card, `
      <div class="gf-challenge-label">${label}${sub ? `<span>${sub}</span>` : ""}</div>
      <div class="gf-reaction-pad" role="button" tabindex="0">
        <div class="gf-reaction-state">HOLD…</div>
        <div class="gf-reaction-sub">tap the moment it turns</div>
      </div>
    `, (wrap, finish) => {
      const pad = wrap.querySelector(".gf-reaction-pad");
      const stateEl = wrap.querySelector(".gf-reaction-state");
      const subEl = wrap.querySelector(".gf-reaction-sub");
      let armed = false, firedAt = 0, done = false;

      const armTimer = setTimeout(() => {
        armed = true;
        firedAt = performance.now();
        pad.classList.add("live");
        stateEl.textContent = "NOW!";
        subEl.textContent = "";
        A.tick();
        if (hapticsOn && navigator.vibrate) navigator.vibrate(12);
      }, delay);

      function tap(e) {
        if (done) return;
        if (e) e.preventDefault();
        if (!armed) {
          // Went too early — dived the wrong way.
          done = true;
          stateEl.textContent = "TOO EARLY!";
          finish(10);
          return;
        }
        done = true;
        const ms = performance.now() - firedAt;
        stateEl.textContent = Math.round(ms) + "ms";
        finish(clamp(100 - ((ms - goodMs) / goodMs) * 70, 0, 100));
      }

      const missTimer = setTimeout(() => { if (!done && armed) { done = true; finish(6); } }, delay + 1400);
      const onKey = (e) => { if (e.code === "Space") { e.preventDefault(); tap(null); } };
      pad.addEventListener("pointerdown", tap);
      document.addEventListener("keydown", onKey);

      return () => {
        done = true;
        clearTimeout(armTimer);
        clearTimeout(missTimer);
        pad.removeEventListener("pointerdown", tap);
        document.removeEventListener("keydown", onKey);
      };
    });
  }

  // ---------- 5. Pick the pass — tap the runner in space ----------

  function pickThePass({ card, label, sub, decoys, windowMs }) {
    const total = decoys + 1;
    const targetIdx = randInt(0, total - 1);
    const dots = Array.from({ length: total }, (_, i) => {
      const top = 12 + Math.random() * 62;
      const left = 8 + Math.random() * 74;
      const dur = 2.2 + Math.random() * 1.8;
      return `<button class="gf-runner ${i === targetIdx ? "open" : ""}" data-i="${i}"
                style="top:${top}%;left:${left}%;animation-duration:${dur}s">
                ${i === targetIdx ? "🟢" : "🔵"}
              </button>`;
    }).join("");

    return shell(card, `
      <div class="gf-challenge-label">${label}${sub ? `<span>${sub}</span>` : ""}</div>
      <div class="gf-pass-field">${dots}
        <div class="gf-pass-timer"><div class="gf-pass-timer-fill"></div></div>
      </div>
    `, (wrap, finish) => {
      const fillEl = wrap.querySelector(".gf-pass-timer-fill");
      fillEl.style.transition = `width ${windowMs}ms linear`;
      requestAnimationFrame(() => { fillEl.style.width = "0%"; });

      const start = performance.now();
      let done = false;

      function onPick(e) {
        if (done) return;
        e.preventDefault();
        done = true;
        const i = Number(e.currentTarget.dataset.i);
        if (i !== targetIdx) {
          e.currentTarget.classList.add("wrong");
          finish(12);
          return;
        }
        e.currentTarget.classList.add("hit");
        const elapsed = performance.now() - start;
        // Reward picking the open runner quickly.
        finish(clamp(100 - (elapsed / windowMs) * 55, 40, 100));
      }

      const runners = [...wrap.querySelectorAll(".gf-runner")];
      runners.forEach((r) => r.addEventListener("pointerdown", onPick));
      const timer = setTimeout(() => { if (!done) { done = true; finish(8); } }, windowMs);

      return () => {
        done = true;
        clearTimeout(timer);
        runners.forEach((r) => r.removeEventListener("pointerdown", onPick));
      };
    });
  }

  // ---------- 6. Hold & release — judge a long kickout ----------

  function holdAndRelease({ card, label, sub, zoneWidthPct, fillMs }) {
    const zoneCenter = 30 + Math.random() * 50;
    return shell(card, `
      <div class="gf-challenge-label">${label}${sub ? `<span>${sub}</span>` : ""}</div>
      <div class="gf-timing-track gf-hold-track">
        <div class="gf-zone great" style="left:${clamp(zoneCenter - zoneWidthPct, 0, 100)}%;width:${zoneWidthPct * 2}%"></div>
        <div class="gf-zone perfect" style="left:${clamp(zoneCenter - zoneWidthPct * 0.4, 0, 100)}%;width:${zoneWidthPct * 0.8}%"></div>
        <div class="gf-hold-fill"></div>
      </div>
      <button class="btn btn-primary gf-action-btn gf-hold-btn">HOLD TO CHARGE<span class="gf-key-hint">release on target</span></button>
    `, (wrap, finish) => {
      const btn = wrap.querySelector(".gf-hold-btn");
      const fill = wrap.querySelector(".gf-hold-fill");
      let holding = false, start = 0, raf, done = false, pct = 0;

      function loop(now) {
        if (!holding || done) return;
        pct = clamp((((now || performance.now()) - start) / fillMs) * 100, 0, 100);
        fill.style.width = pct + "%";
        if (pct >= 100) { release(); return; }
        raf = requestAnimationFrame(loop);
      }
      function press(e) {
        if (done || holding) return;
        e.preventDefault();
        holding = true;
        start = performance.now();
        btn.textContent = "RELEASE!";
        raf = requestAnimationFrame(loop);
      }
      function release(e) {
        if (done || !holding) return;
        if (e) e.preventDefault();
        done = true;
        holding = false;
        cancelAnimationFrame(raf);
        const dist = Math.abs(pct - zoneCenter);
        let score;
        if (dist <= zoneWidthPct * 0.4) score = 100 - (dist / (zoneWidthPct * 0.4)) * 10;
        else if (dist <= zoneWidthPct) score = 86 - ((dist - zoneWidthPct * 0.4) / (zoneWidthPct * 0.6)) * 22;
        else score = clamp(60 - (dist - zoneWidthPct) * 2.2, 4, 60);
        finish(score);
      }

      // Android raises a context menu on long-press, which CSS cannot suppress.
      const blockMenu = (e) => e.preventDefault();

      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("contextmenu", blockMenu);
      const timer = setTimeout(() => { if (!done) { done = true; finish(6); } }, fillMs + 3000);

      return () => {
        done = true;
        clearTimeout(timer);
        cancelAnimationFrame(raf);
        btn.removeEventListener("pointerdown", press);
        btn.removeEventListener("pointerup", release);
        btn.removeEventListener("pointerleave", release);
        btn.removeEventListener("contextmenu", blockMenu);
      };
    });
  }

  window.GaaMinigames = {
    timingBar, swipeKick, tapRush, reactionTap, pickThePass, holdAndRelease, rate,
    setHaptics(v) { hapticsOn = !!v; },
  };
})();

</script>
<script>
// Gaelic Hero — Match Day. Builds a sequence of skill events weighted by the
// player's position, runs them through minigames.js, then hands the combined
// contribution to data.js to resolve the fixture and advance the season.

(function () {
  const A = window.GaaAudio;
  const C = window.GaaConfetti;
  const M = window.GaaMinigames;
  const GD = window.GaaGuide;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  /** Attribute-driven difficulty: better players get a wider window, tougher tiers a faster one. */
  function tuning(state, attrKey, speedBase) {
    const attr = state.attributes[attrKey];
    const zoneWidthPct = clamp(6.5 + attr * 0.17, 6.5, 24);
    let speed = speedBase * (1 + state.tierIndex * 0.075);
    if (state.energy < 30) speed *= 1.18;
    return { zoneWidthPct, periodMs: 1000 / speed };
  }

  // ---------- Event definitions ----------

  const EVENTS = {
    async shot(card, state, ticker) {
      const power = tuning(state, "kicking", 0.8);
      const p1 = await M.timingBar({ card, label: "SHOT AT GOAL", sub: "POWER", ...power });
      const place = tuning(state, "freeTaking", 0.95);
      const p2 = await M.timingBar({ card, label: "SHOT AT GOAL", sub: "PLACEMENT", ...place });
      const score = Math.round((p1.score + p2.score) / 2);
      let text, log;
      if (score >= 85) {
        const goal = Math.random() < 0.4;
        text = goal ? "GOAL!!!" : "SPLIT THE POSTS!";
        log = goal ? "Buried it low to the corner — GOAL!" : "Clean strike, straight over the black spot.";
      } else if (score >= 60) { text = "POINT!"; log = "Over the bar — point."; }
      else if (score >= 35) { text = "WIDE!"; log = "Pulled it wide of the near post."; }
      else { text = "BLOCKED!"; log = "Charged down — turned over in a dangerous spot."; }
      flash(card, text, score >= 60);
      tick(ticker, log);
      return { type: "shot", score };
    },

    async free(card, state, ticker) {
      const skill = state.attributes.freeTaking;
      const r = await M.swipeKick({
        card, label: "FREE KICK", sub: "AIM & POWER",
        tolerance: { angle: clamp(10 + skill * 0.32, 10, 42), power: clamp(14 + skill * 0.36, 14, 50) },
      });
      let text, log;
      if (r.score >= 80) { text = "SPLIT THE POSTS!"; log = "Dead-eye free — never in doubt."; }
      else if (r.score >= 55) { text = "POINT!"; log = "Free converted."; }
      else { text = "MISSED THE FREE"; log = "Dropped the free short and wide. Costly."; }
      flash(card, text, r.score >= 55);
      tick(ticker, log);
      return { type: "free", score: r.score };
    },

    async catch_(card, state, ticker) {
      const skill = state.attributes.fielding;
      const r = await M.holdAndRelease({
        card, label: "HIGH BALL DROPPING IN", sub: "CHARGE YOUR LEAP, RELEASE AT THE APEX",
        zoneWidthPct: clamp(9 + skill * 0.16, 9, 24),
        fillMs: clamp(1500 - state.tierIndex * 60, 900, 1500),
      });
      let text, log;
      if (r.score >= 70) { text = "CLEAN CATCH!"; log = "Rose above the lot of them and plucked it."; }
      else if (r.score >= 40) { text = "BROKE IT DOWN"; log = "Couldn't hold it, but you broke it to a teammate."; }
      else { text = "SPILLED IT!"; log = "Misjudged the flight — turned over under the dropping ball."; }
      flash(card, text, r.score >= 40);
      tick(ticker, log);
      return { type: "catch", score: r.score };
    },

    async tackle(card, state, ticker) {
      const t = tuning(state, "tackling", 1.3);
      const r = await M.timingBar({ card, label: "TIME YOUR TACKLE", icon: "🛡️", ...t });
      let text, log;
      if (r.score >= 70) { text = "TURNOVER!"; log = "Textbook tackle — stripped him clean."; }
      else if (r.score >= 40) { text = "SLOWED HIM"; log = "Got a hand in and slowed the attack."; }
      else { text = "BEATEN!"; log = "Sold a dummy and left for dead."; }
      flash(card, text, r.score >= 40);
      tick(ticker, log);
      return { type: "tackle", score: r.score };
    },

    async sprint(card, state, ticker) {
      const pace = state.attributes.speed;
      const r = await M.tapRush({
        card, label: "SOLO RUN — BURST CLEAR", sub: "TAP AS FAST AS YOU CAN",
        targetTaps: Math.round(clamp(30 - pace * 0.16, 14, 30) + state.tierIndex * 1.4),
        durationMs: 3000,
      });
      let text, log;
      if (r.score >= 75) { text = "BURST CLEAR!"; log = "Left the cover for dead on a driving solo run."; }
      else if (r.score >= 40) { text = "HELD UP"; log = "Got a few yards before the cover arrived."; }
      else { text = "SWALLOWED UP"; log = "No legs — swarmed and dispossessed."; }
      flash(card, text, r.score >= 40);
      tick(ticker, log);
      return { type: "sprint", score: r.score };
    },

    async block(card, state, ticker) {
      const r = await M.reactionTap({
        card, label: "SHOT INCOMING — BLOCK IT", sub: "WAIT FOR IT",
        goodMs: clamp(420 - state.attributes.reflexes * 2.2, 170, 420),
      });
      let text, log;
      if (r.score >= 70) { text = "BLOCKED IT!"; log = "Threw the body on the line — brilliant block."; }
      else if (r.score >= 40) { text = "DEFLECTED"; log = "Got a fingertip to it and put it wide."; }
      else { text = "SCORED PAST YOU"; log = "Too slow off the mark — they scored."; }
      flash(card, text, r.score >= 40);
      tick(ticker, log);
      return { type: "block", score: r.score };
    },

    async pass(card, state, ticker) {
      const vision = state.attributes.vision;
      const r = await M.pickThePass({
        card, label: "PICK THE PASS", sub: "FIND THE RUNNER IN SPACE",
        decoys: clamp(2 + Math.floor(state.tierIndex / 2), 2, 5),
        windowMs: clamp(2600 - state.tierIndex * 90 + vision * 8, 1500, 3200),
      });
      let text, log;
      if (r.score >= 70) { text = "SPLIT THE DEFENCE!"; log = "Picked out the runner with a killer ball."; }
      else if (r.score >= 40) { text = "SAFE BALL"; log = "Took the simple option and kept possession."; }
      else { text = "TURNOVER!"; log = "Hit it straight to a defender — coughed it up."; }
      flash(card, text, r.score >= 40);
      tick(ticker, log);
      return { type: "pass", score: r.score };
    },
  };

  function flash(card, text, good) {
    const el = document.createElement("div");
    el.className = `gf-moment-flash ${good ? "good" : "bad"}`;
    el.textContent = text;
    card.appendChild(el);
    card.classList.remove("shake-good", "shake-bad");
    void card.offsetWidth;
    card.classList.add(good ? "shake-good" : "shake-bad");
    setTimeout(() => el.remove(), 1050);
  }

  function tick(ticker, text) {
    const line = document.createElement("div");
    line.className = "gf-ticker-line";
    line.textContent = text;
    ticker.prepend(line);
    while (ticker.children.length > 3) ticker.removeChild(ticker.lastChild);
  }

  /** Weighted event plan for this position, with a shot guaranteed somewhere. */
  function buildPlan(state, G, count) {
    const pos = G.POSITIONS.find((p) => p.key === state.position) || G.POSITIONS[0];
    const pool = [];
    Object.entries(pos.weights).forEach(([kind, w]) => {
      for (let i = 0; i < w; i++) pool.push(kind);
    });
    const plan = [];
    for (let i = 0; i < count; i++) plan.push(pool[randInt(0, pool.length - 1)]);
    if (!plan.includes("shot") && !plan.includes("free")) plan[randInt(0, plan.length - 1)] = "shot";
    return plan;
  }

  // ---------- Overlay ----------

  function buildOverlay(state, G, meta) {
    const overlay = document.createElement("div");
    overlay.className = "gf-match-overlay";
    overlay.innerHTML = `
      <div class="gf-match-card">
        <div class="gf-match-head">
          <button class="gf-quit" data-action="quit" aria-label="Abandon match">✕</button>
          <div class="gf-match-tier">${meta.label.toUpperCase()}</div>
          <div class="gf-match-vs">
            <span class="team you">${G.teamName(state)}</span>
            <span class="vs">v</span>
            <span class="team rival">${meta.oppName}</span>
          </div>
        </div>
        <div class="gf-pitch">
          <div class="gf-pitch-stripes"></div>
          <div class="gf-goal"></div>
          <div class="gf-card-inner"></div>
        </div>
        <div class="gf-moment-ticker"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    return overlay;
  }

  async function playIntro(pitchEl) {
    const intro = document.createElement("div");
    intro.className = "gf-throwin";
    intro.innerHTML = `<div class="gf-throwin-text">THROW IN!</div>`;
    pitchEl.appendChild(intro);
    A.whistle();
    await new Promise((r) => setTimeout(r, 850));
    intro.remove();
  }

  function renderFullTime(overlay, { state, G, summary, onContinue }) {
    const card = overlay.querySelector(".gf-match-card");
    const win = summary.result === "win";
    const draw = summary.result === "draw";

    if (win) A.cheer();
    const bigMoment = summary.championshipWon || summary.allIreland;
    if (bigMoment) { A.trophy(); C.burst({}); }

    const pos = state.league ? window.GaaSeason.playerPosition(state.league) : null;
    const badges = [];
    if (summary.motm) badges.push(`<div class="gf-motm-banner">⭐ MAN OF THE MATCH</div>`);
    if (summary.allIreland) badges.push(`<div class="gf-motm-banner gold">🏆 ALL-IRELAND CHAMPIONS</div>`);
    else if (summary.championshipWon) badges.push(`<div class="gf-motm-banner gold">🏆 CHAMPIONSHIP WINNERS</div>`);
    if (summary.eliminated) badges.push(`<div class="gf-motm-banner">Season over — knocked out.</div>`);

    card.innerHTML = `
      <div class="gf-fulltime">
        <div class="gf-fulltime-label">FULL TIME</div>
        <div class="gf-score-final">
          <span>${G.scoreString(summary.yourScore)} <small>(${summary.yourScore.total})</small></span>
          <span class="dim">—</span>
          <span>${G.scoreString(summary.oppScore)} <small>(${summary.oppScore.total})</small></span>
        </div>
        <div class="gf-result-banner ${win ? "win" : draw ? "draw" : "loss"}">
          ${win ? "WIN" : draw ? "DRAW" : "DEFEAT"}
        </div>
        ${badges.join("")}
        <div class="gf-skill-index">
          <div class="l">Performance rating · ${summary.skillIndex}</div>
          <div class="gf-bar-track"><div class="gf-bar-fill" style="width:${summary.skillIndex}%"></div></div>
        </div>
        <div class="gf-rewards">
          <div class="gf-reward"><div class="n">+${summary.tpEarned}</div><div class="l">Training pts</div></div>
          ${summary.kind === "league" && pos ? `<div class="gf-reward"><div class="n">${G.ordinal(pos)}</div><div class="l">In the table</div></div>` : ""}
        </div>
        <button class="btn btn-primary" data-action="match-continue">Continue</button>
      </div>
    `;
    card.querySelector('[data-action="match-continue"]')
      .addEventListener("click", () => { overlay.remove(); onContinue(); });
  }

  async function start(state, G, kind, onComplete, onSeen) {
    A.unlock();
    onSeen = onSeen || (() => {});
    const meta = kind === "championship" ? G.nextChampionshipFixture(state) : G.nextLeagueFixture(state);
    if (!meta) return;

    const overlay = buildOverlay(state, G, meta);
    const pitchEl = overlay.querySelector(".gf-pitch");
    const cardInner = overlay.querySelector(".gf-card-inner");
    const ticker = overlay.querySelector(".gf-moment-ticker");

    // Abandoning forfeits the fixture — the state is only committed at full time.
    let abandoned = false;
    overlay.querySelector('[data-action="quit"]').addEventListener("click", () => {
      if (!confirm("Abandon this match? It won't be recorded and you'll come back to it.")) return;
      abandoned = true;
      overlay.remove();
    });

    await playIntro(pitchEl);

    const count = kind === "championship" ? (meta.isFinal ? 8 : 7) : 6;
    const plan = buildPlan(state, G, count);

    // Explain each mini-game the first time a player ever meets it.
    let working = state;
    const events = [];
    for (const k of plan) {
      if (abandoned) return;
      const guideKey = k;
      if (GD.byKey[guideKey] && !(working.seenGames || {})[guideKey]) {
        await GD.coachCard(GD.byKey[guideKey]);
        working = G.markGameSeen(working, guideKey);
        onSeen(working);
      }
      if (abandoned) return;
      const fn = k === "catch" ? EVENTS.catch_ : EVENTS[k];
      events.push(await fn(cardInner, working, ticker));
      await new Promise((r) => setTimeout(r, 240));
    }
    if (abandoned) return;
    state = working;

    const contribution = G.resolvePlayerEvents(events);
    const newState = kind === "championship"
      ? G.playChampionshipMatch(state, contribution)
      : G.playLeagueMatch(state, contribution);

    renderFullTime(overlay, {
      state: newState,
      G,
      summary: newState.lastMatchSummary,
      onContinue: () => onComplete(newState),
    });
  }

  /**
   * Runs a single mini-game with nothing at stake, so a player can learn the
   * controls without spending a fixture on it.
   */
  async function practice(state, G, kind) {
    A.unlock();
    const g = GD.byKey[kind];
    const overlay = document.createElement("div");
    overlay.className = "gf-match-overlay";
    overlay.innerHTML = `
      <div class="gf-match-card">
        <div class="gf-match-head">
          <button class="gf-quit" data-action="quit" aria-label="Leave practice">✕</button>
          <div class="gf-match-tier">Practice · no effect on your career</div>
          <div class="gf-match-vs solo"><span class="team you">${g.icon} ${g.name}</span></div>
        </div>
        <div class="gf-pitch">
          <div class="gf-pitch-stripes"></div>
          <div class="gf-goal"></div>
          <div class="gf-card-inner"></div>
        </div>
        <div class="gf-moment-ticker"></div>
      </div>
    `;
    document.body.appendChild(overlay);

    let left = false;
    overlay.querySelector('[data-action="quit"]').addEventListener("click", () => {
      left = true;
      overlay.remove();
    });

    const cardInner = overlay.querySelector(".gf-card-inner");
    const ticker = overlay.querySelector(".gf-moment-ticker");
    const fn = kind === "catch" ? EVENTS.catch_ : EVENTS[kind];

    // Loop until they leave, so they can drill the same skill repeatedly.
    while (!left) {
      const ev = await fn(cardInner, state, ticker);
      if (left) return;
      const rating = M.rate(ev.score);
      const again = document.createElement("div");
      again.className = "gf-practice-again";
      again.innerHTML = `
        <div class="gf-practice-score r-${rating}">${ev.score}<small>/100</small></div>
        <button class="btn btn-primary" data-action="again">Try again</button>
        <button class="btn" data-action="done">Done</button>
      `;
      cardInner.appendChild(again);
      const choice = await new Promise((resolve) => {
        again.querySelector('[data-action="again"]').addEventListener("click", () => resolve("again"));
        again.querySelector('[data-action="done"]').addEventListener("click", () => resolve("done"));
      });
      again.remove();
      if (choice === "done") { overlay.remove(); return; }
    }
  }

  window.GaaMatch = { start, practice };
})();

</script>
<script>
// Gaelic Hero — UI shell. Renders the career screens and routes actions to
// data.js / match.js. Mobile-first: a bottom tab bar, thumb-reachable
// primary actions, and no hover-dependent affordances.

(function () {
  const SAVE_KEY = "gaa-career-save-v2";
  const G = window.GaaCareer;
  const S = window.GaaSeason;
  const GD = window.GaaGuide;
  const P = window.GaaProgress;
  const app = document.getElementById("app");

  let state = load();
  let tab = "season";

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      // Heal a save that stalled mid-transition rather than stranding the
      // player on a screen with no way forward.
      return G.reconcile(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }
  function setState(next) { state = next; save(); applySettings(); render(); }

  /** Persist without a re-render — used mid-match so the overlay isn't disturbed. */
  function persist(next) { state = next; save(); }

  function applySettings() {
    const st = (state && state.settings) || {};
    window.GaaAudio.setMuted(st.sound === false);
    window.GaaMinigames.setHaptics(st.haptics !== false);
  }

  function esc(str) {
    const d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  // ---------- Setup ----------

  function renderSetup() {
    app.innerHTML = `
      <div class="gf-wrap gf-setup">
        <div class="gf-crest">⚽</div>
        <h1>Gaelic Hero</h1>
        <p class="dim">Ten league games a season. Win your division to go up,
          finish bottom and you go down. Then it's knockout championship
          football — all the way to Sam Maguire.</p>

        <div class="panel">
          <div class="field">
            <label for="f-name">Player name</label>
            <input id="f-name" type="text" placeholder="Cian Walsh" maxlength="24" autocomplete="off" />
          </div>
          <div class="field">
            <label for="f-club">Club</label>
            <input id="f-club" type="text" placeholder="St. Brigid's" maxlength="24" autocomplete="off" />
          </div>
          <div class="field">
            <label for="f-county">County</label>
            <select id="f-county">${G.COUNTIES.map((c) => `<option${c === "Mayo" ? " selected" : ""}>${c}</option>`).join("")}</select>
          </div>
        </div>

        <div class="panel">
          <label>Position</label>
          <div class="gf-pos-grid">
            ${G.POSITIONS.map((p, i) => `
              <button class="gf-pos ${i === 0 ? "on" : ""}" data-pos="${p.key}">
                <span class="n">${esc(p.label)}</span>
                <span class="b">${esc(p.blurb)}</span>
              </button>`).join("")}
          </div>
          <p class="dim small" style="margin-top:10px">Your position decides which match situations you face.</p>
        </div>

        <button class="btn btn-primary btn-lg" data-action="start">Start Career</button>
      </div>
    `;

    let chosen = G.POSITIONS[0].key;
    app.querySelectorAll(".gf-pos").forEach((btn) => {
      btn.addEventListener("click", () => {
        chosen = btn.dataset.pos;
        app.querySelectorAll(".gf-pos").forEach((b) => b.classList.toggle("on", b === btn));
      });
    });
    app.querySelector('[data-action="start"]').addEventListener("click", () => {
      setState(G.createCareer({
        name: document.getElementById("f-name").value,
        club: document.getElementById("f-club").value,
        county: document.getElementById("f-county").value,
        positionKey: chosen,
      }));
    });
  }

  // ---------- Shared chrome ----------

  function headerHtml() {
    const tier = G.TIERS[state.tierIndex];
    const overall = G.computeOverall(state.attributes);
    const pos = G.POSITIONS.find((p) => p.key === state.position);
    return `
      <header class="gf-header">
        <div class="gf-id">
          <div class="gf-title">${esc(state.name)}</div>
          <div class="gf-sub">${esc(pos.label)} · ${esc(G.teamName(state))} · ${esc(tier.label)}</div>
        </div>
        <div class="gf-ovr" title="Overall rating"><span>${overall}</span><small>OVR</small></div>
      </header>
      <div class="gf-statstrip">
        <div class="gf-stat"><span class="l">Season</span><span class="v">${state.season}</span></div>
        <div class="gf-stat"><span class="l">All-Irelands</span><span class="v gold">${state.career.allIrelands}</span></div>
        <div class="gf-stat"><span class="l">All Stars</span><span class="v gold">${state.career.allStars}</span></div>
        <div class="gf-stat"><span class="l">Form</span><span class="v">${formHtml()}</span></div>
      </div>
    `;
  }

  function formHtml() {
    if (!state.form.length) return `<span class="dim">—</span>`;
    return state.form.map((r) => `<i class="gf-form ${r.toLowerCase()}">${r}</i>`).join("");
  }

  function energyHtml() {
    const low = state.energy < 30;
    return `
      <div class="panel">
        <div class="gf-row-between">
          <span class="k">Energy${state.injury ? ` <span class="gf-injury">· ${esc(state.injury.label)}</span>` : ""}</span>
          <span class="v">${state.energy}/100</span>
        </div>
        <div class="gf-bar-track"><div class="gf-bar-fill energy ${low ? "low" : ""}" style="width:${state.energy}%"></div></div>
        ${low ? `<p class="dim small" style="margin:8px 0 0">Running on empty — you'll play worse and risk a knock. Rest up.</p>` : ""}
      </div>
    `;
  }

  // ---------- Season tab ----------

  function seasonTabHtml() {
    if (state.phase === "offseason") return offseasonHtml();

    const tier = G.TIERS[state.tierIndex];
    const isChamp = state.phase === "championship";
    const meta = isChamp ? G.nextChampionshipFixture(state) : G.nextLeagueFixture(state);
    const blocked = !!state.injury;

    let fixtureCard;
    if (!meta) {
      fixtureCard = `<div class="panel"><p class="dim">No fixture scheduled.</p></div>`;
    } else {
      fixtureCard = `
        <div class="gf-fixture ${isChamp ? "champ" : ""}">
          <div class="gf-fixture-tag">${isChamp ? "🏆 " : ""}${esc(meta.label)}</div>
          <div class="gf-fixture-teams">
            <span>${esc(G.teamName(state))}</span>
            <span class="vs">v</span>
            <span>${esc(meta.oppName)}</span>
          </div>
          ${!isChamp ? `<div class="gf-fixture-venue">${meta.atHome ? "Home" : "Away"} · Round ${state.league.round + 1} of ${S.LEAGUE_ROUNDS}</div>` : `<div class="gf-fixture-venue">Win or your season is over</div>`}
          ${blocked
            ? `<p class="gf-blocked">Injured — ${esc(state.injury.label)}. Rest to recover (${state.injury.games} game${state.injury.games > 1 ? "s" : ""}).</p>`
            : `<button class="btn btn-primary btn-lg" data-action="${isChamp ? "play-champ" : "play-league"}">Play Match</button>`}
          <button class="btn" data-action="rest">Rest Up</button>
        </div>
      `;
    }

    return `
      ${fixtureCard}
      ${energyHtml()}
      ${!isChamp ? leagueProgressHtml() : ""}
      <div class="panel">
        <div class="gf-row-between"><span class="k">Match News</span></div>
        <div class="gf-log">${state.log.map((e) => `<div class="gf-log-item ${e.type}">${esc(e.text)}</div>`).join("")}</div>
      </div>
    `;
  }

  function leagueProgressHtml() {
    const played = state.league.round;
    const pct = Math.round((played / S.LEAGUE_ROUNDS) * 100);
    const pos = S.playerPosition(state.league);
    return `
      <div class="panel">
        <div class="gf-row-between">
          <span class="k">League progress</span>
          <span class="v">${played}/${S.LEAGUE_ROUNDS} played · ${G.ordinal(pos)}</span>
        </div>
        <div class="gf-bar-track"><div class="gf-bar-fill" style="width:${pct}%"></div></div>
        <p class="dim small" style="margin:10px 0 0">
          Win the division to go up. Finish ${S.TEAMS_PER_DIVISION}th and you go down.
        </p>
        ${state.objective ? `
          <div class="gf-objective ${pos <= state.objective.target ? "met" : ""}">
            <span class="l">Manager's target</span>
            <span class="d">${esc(state.objective.desc)}</span>
            <span class="s">${pos <= state.objective.target ? "On track" : "Off track"}</span>
          </div>` : ""}
      </div>
    `;
  }

  function offseasonHtml() {
    const champ = state.championship || {};
    const tier = G.TIERS[state.tierIndex];
    const change = state.pendingTierChange || 0;
    return `
      <div class="gf-final-panel">
        <h2>Season ${state.season} complete</h2>
        <p>
          Finished ${G.ordinal(state.leagueFinishPos || S.TEAMS_PER_DIVISION)} in ${esc(tier.division)}.
          ${champ.won ? "Championship won." : "Knocked out of the championship."}
        </p>
        ${change > 0 ? `<div class="gf-motm-banner gold">⬆ Promoted to ${esc(G.TIERS[state.tierIndex + 1].division)}</div>` : ""}
        ${change < 0 ? `<div class="gf-motm-banner">⬇ Relegated to ${esc(G.TIERS[state.tierIndex - 1].division)}</div>` : ""}
        <button class="btn btn-primary btn-lg" data-action="next-season">Start Season ${state.season + 1}</button>
      </div>
      <div class="panel">
        <div class="gf-row-between"><span class="k">Season Review</span></div>
        <div class="gf-log">${state.log.map((e) => `<div class="gf-log-item ${e.type}">${esc(e.text)}</div>`).join("")}</div>
      </div>
    `;
  }

  // ---------- Table tab ----------

  function tableTabHtml() {
    const tier = G.TIERS[state.tierIndex];
    const rows = S.sortTable(state.league.table);
    const last = S.TEAMS_PER_DIVISION;
    return `
      <div class="panel">
        <div class="gf-row-between">
          <span class="k">${esc(tier.division)}</span>
          <span class="v">Season ${state.season}</span>
        </div>
        <div class="gf-table-scroll">
          <table class="gf-table">
            <thead>
              <tr><th>#</th><th class="tl">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>+/−</th><th>Pts</th></tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr class="${r.isPlayer ? "me" : ""} ${i === 0 ? "promo" : ""} ${i === last - 1 ? "releg" : ""}">
                  <td>${i + 1}</td>
                  <td class="tl">${esc(r.name)}</td>
                  <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
                  <td>${r.f - r.a > 0 ? "+" : ""}${r.f - r.a}</td>
                  <td class="pts">${r.pts}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="gf-legend">
          <span><i class="sw promo"></i> Promoted</span>
          <span><i class="sw releg"></i> Relegated</span>
        </div>
      </div>
      <div class="panel">
        <div class="gf-row-between"><span class="k">The Ladder</span></div>
        <div class="gf-ladder">
          ${G.TIERS.map((t, i) => `
            <div class="gf-ladder-step ${i < state.tierIndex ? "done" : ""} ${i === state.tierIndex ? "current" : ""}">
              <span class="dot"></span>${esc(t.division)}
            </div>`).join("")}
        </div>
      </div>
    `;
  }

  // ---------- Player tab ----------

  function playerTabHtml() {
    const c = state.career;
    return `
      <div class="panel">
        <div class="gf-row-between">
          <span class="k">Attributes</span>
          <span class="gf-tp">⚡ ${state.trainingPoints} pts</span>
        </div>
        ${G.ATTRS.map((a) => {
          const v = state.attributes[a.key];
          const cost = G.upgradeCost(v);
          const can = Number.isFinite(cost) && state.trainingPoints >= cost;
          return `
            <div class="gf-attr">
              <div class="gf-attr-head">
                <span class="name">${esc(a.label)} <span class="dim">${esc(a.hint)}</span></span>
                <span class="val">${v}</span>
              </div>
              <div class="gf-attr-row">
                <div class="gf-bar-track"><div class="gf-bar-fill" style="width:${v}%"></div></div>
                <button class="gf-upgrade-btn" data-action="upgrade" data-key="${a.key}" ${can ? "" : "disabled"}>
                  +<small>${Number.isFinite(cost) ? cost : "—"}</small>
                </button>
              </div>
            </div>`;
        }).join("")}
      </div>

      <div class="panel">
        <div class="gf-row-between"><span class="k">Career Record</span></div>
        <div class="gf-record">
          ${[
            ["Played", c.matches], ["Won", c.wins], ["Drawn", c.draws], ["Lost", c.losses],
            ["Goals", c.goals], ["Points", c.points], ["MOTM", c.motm],
            ["Leagues", c.leaguesWon], ["Championships", c.championships],
            ["Promotions", c.promotions], ["Relegations", c.relegations],
            ["All-Irelands", c.allIrelands], ["All Stars", c.allStars],
          ].map(([l, v]) => `<div class="gf-rec"><span class="n">${v}</span><span class="l">${l}</span></div>`).join("")}
        </div>
      </div>

      <div class="panel">
        <button class="btn btn-quiet" data-action="reset">Retire &amp; start a new career</button>
      </div>
    `;
  }

  // ---------- Guide tab ----------

  function guideTabHtml() {
    const st = state.settings || {};
    const have = new Set(state.achievements || []);
    const unlocked = P.ACHIEVEMENTS.filter((a) => have.has(a.key)).length;

    return `
      <div class="panel">
        <div class="gf-row-between"><span class="k">How to play the mini-games</span></div>
        <p class="dim small" style="margin:0 0 12px">
          Matches are played, not simulated. Tap <b>Practice</b> on any of these to drill it
          with nothing at stake.
        </p>
        <div class="gf-guide-list">
          ${GD.GUIDE.map((g) => `
            <details class="gf-guide-item">
              <summary>
                <span class="ic">${g.icon}</span>
                <span class="nm">${esc(g.name)}</span>
                <span class="at">${esc(g.attr)}</span>
              </summary>
              <div class="gf-guide-body">
                <p class="how">${g.how}</p>
                <p class="tip">${g.tip}</p>
                <button class="btn btn-primary" data-action="practice" data-kind="${g.key}">Practice ${esc(g.name)}</button>
              </div>
            </details>`).join("")}
        </div>
      </div>

      <div class="panel">
        <div class="gf-row-between"><span class="k">How the career works</span></div>
        <div class="gf-rules">
          ${GD.RULES.map((r) => `
            <div class="gf-rule">
              <div class="t">${esc(r.title)}</div>
              <div class="b">${r.body}</div>
            </div>`).join("")}
        </div>
      </div>

      <div class="panel">
        <div class="gf-row-between">
          <span class="k">Achievements</span>
          <span class="v">${unlocked}/${P.ACHIEVEMENTS.length}</span>
        </div>
        <div class="gf-ach-list">
          ${P.ACHIEVEMENTS.map((a) => `
            <div class="gf-ach ${have.has(a.key) ? "on" : ""}">
              <span class="ic">${have.has(a.key) ? "🏅" : "🔒"}</span>
              <span class="tx"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span>
            </div>`).join("")}
        </div>
      </div>

      <div class="panel">
        <div class="gf-row-between"><span class="k">Settings</span></div>
        <button class="gf-toggle ${st.sound !== false ? "on" : ""}" data-action="toggle" data-key="sound">
          <span>Sound effects</span><i></i>
        </button>
        <button class="gf-toggle ${st.haptics !== false ? "on" : ""}" data-action="toggle" data-key="haptics">
          <span>Vibration</span><i></i>
        </button>
      </div>
    `;
  }

  // ---------- Render ----------

  function render() {
    if (!state) { renderSetup(); return; }
    if (state.phase === "offseason") tab = "season";

    const body = tab === "table" ? tableTabHtml()
      : tab === "player" ? playerTabHtml()
      : tab === "guide" ? guideTabHtml()
      : seasonTabHtml();

    app.innerHTML = `
      <div class="gf-app">
        <div class="gf-wrap">
          ${headerHtml()}
          ${body}
        </div>
        <nav class="gf-tabbar">
          <button class="gf-tabbtn ${tab === "season" ? "on" : ""}" data-tab="season"><span>🏟️</span>Season</button>
          <button class="gf-tabbtn ${tab === "table" ? "on" : ""}" data-tab="table"><span>📊</span>Table</button>
          <button class="gf-tabbtn ${tab === "player" ? "on" : ""}" data-tab="player"><span>👤</span>Player</button>
          <button class="gf-tabbtn ${tab === "guide" ? "on" : ""}" data-tab="guide"><span>📖</span>Guide</button>
        </nav>
      </div>
    `;
    wire();
  }

  function wire() {
    app.querySelectorAll("[data-tab]").forEach((b) => {
      b.addEventListener("click", () => { tab = b.dataset.tab; render(); });
    });

    const on = (sel, fn) => {
      const el = app.querySelector(sel);
      if (el) el.addEventListener("click", fn);
    };

    on('[data-action="play-league"]', () => window.GaaMatch.start(state, G, "league", setState, persist));
    on('[data-action="play-champ"]', () => window.GaaMatch.start(state, G, "championship", setState, persist));
    on('[data-action="rest"]', () => setState(G.restUp(state)));
    on('[data-action="next-season"]', () => setState(G.startNextSeason(state)));
    on('[data-action="reset"]', () => {
      if (confirm("Retire this player and start over? Your career record will be lost.")) {
        localStorage.removeItem(SAVE_KEY);
        state = null;
        tab = "season";
        render();
      }
    });

    app.querySelectorAll('[data-action="upgrade"]').forEach((btn) => {
      btn.addEventListener("click", () => setState(G.upgradeAttribute(state, btn.dataset.key)));
    });

    app.querySelectorAll('[data-action="practice"]').forEach((btn) => {
      btn.addEventListener("click", () => window.GaaMatch.practice(state, G, btn.dataset.kind));
    });

    app.querySelectorAll('[data-action="toggle"]').forEach((btn) => {
      btn.addEventListener("click", () => setState(G.toggleSetting(state, btn.dataset.key)));
    });
  }

  applySettings();
  render();
})();

</script>
<script>
// Gaelic Hero — native shell integration.
//
// Everything here is optional: on the plain web the Capacitor globals simply
// aren't there and every call short-circuits, so the same bundle runs as a
// website, a PWA, and inside the iOS/Android wrappers.

(function () {
  const cap = window.Capacitor;
  const isNative = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
  const plugin = (name) => (cap && cap.Plugins && cap.Plugins[name]) || null;

  window.GaaNative = { isNative, platform: (cap && cap.getPlatform && cap.getPlatform()) || "web" };

  if (!isNative) return;

  // Hide the launch screen once the first frame is actually up, rather than
  // on a fixed timer that can flash an empty view on a slow device.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const splash = plugin("SplashScreen");
      if (splash) splash.hide().catch(() => {});
    });
  });

  const statusBar = plugin("StatusBar");
  if (statusBar) {
    statusBar.setStyle({ style: "DARK" }).catch(() => {});
    statusBar.setBackgroundColor({ color: "#0E1116" }).catch(() => {});
  }

  // Android hardware back: close whatever is open before leaving the app, so
  // back never drops a player out of the game mid-match by surprise.
  const app = plugin("App");
  if (app && app.addListener) {
    app.addListener("backButton", () => {
      const coach = document.querySelector('[data-action="coach-ok"]');
      if (coach) { coach.click(); return; }

      const cont = document.querySelector('[data-action="match-continue"]');
      if (cont) { cont.click(); return; }

      const quit = document.querySelector(".gf-match-overlay .gf-quit");
      if (quit) { quit.click(); return; }

      // On a career screen: step back to the Season tab before exiting.
      const activeTab = document.querySelector(".gf-tabbtn.on");
      if (activeTab && activeTab.dataset.tab !== "season") {
        const season = document.querySelector('.gf-tabbtn[data-tab="season"]');
        if (season) { season.click(); return; }
      }

      app.exitApp();
    });
  }
})();

</script>
<script>
  // Only meaningful on the web/PWA build: the native shell already ships the
  // assets on-device, and file:// has no service worker support.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
